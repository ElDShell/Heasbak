  $('#lastSave').textContent = l ? l : '—';
}

let _dailyTry=0;
function tick(){
  const now = Date.now();
  if(new Date(now).getSeconds()===0 && now-_dailyTry>600000){_dailyTry=now;checkDailyExport()}   // v8: التطبيق مفتوح عند تغيّر اليوم؛ محاولة كل 10 دقائق كحد أدنى كي لا تتكرر رسالة فشل
  if(new Date(now).getSeconds()===30&&nativeOwnsBackup()){adoptNativeBackup();syncSlotNative()}   // v13 (+v14)
  let s = Math.max(0, Math.floor((nextSlot(now)-now)/1000));
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  $('#countdown').textContent = h+' س '+m+' د '+s+' ث';
}

/* v10: المظهر: light | dark | auto (يتبع النظام). الجانب الأصلي يُبلَّغ بألوان الأشرطة كي لا يظهر شريط أبيض في الوضع الداكن */
const themePref=()=>{const t=store.get(K.theme,'light');return t==='dark'||t==='auto'?t:'light'};
function systemDark(){
  try{const B=window.Android;if(B&&typeof B.isSystemDark==='function')return !!B.isSystemDark()}catch(e){}
  try{return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){return false}
}
function isDark(){const t=themePref();return t==='auto'?systemDark():t==='dark'}
function syncBars(){
  try{
    const B=window.Android;if(!B||typeof B.setBars!=='function')return;
    const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
    const lockOn=!!($('#lock')&&!$('#lock').hidden);
    B.setBars(g('--hd1'),lockOn?g('--hd2'):g('--bg'),g('--bg'));
  }catch(e){}
}
function applyTheme(){
  const dark=isDark();
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  try{const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#060b18':'#0e1a33'}catch(e){}
  syncBars();
}
window.onSystemTheme=function(){if(themePref()==='auto')applyTheme()};
try{const mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(themePref()==='auto')applyTheme()})}catch(e){}
function toggleTheme(){
  const next=isDark()?'light':'dark';
  store.set(K.theme,next);applyTheme();
  toast(next==='dark'?'تم تفعيل الوضع الداكن':'تم تفعيل الوضع الفاتح','info');
}

function animateNumber(el,to){
  const from=el._v||0;el._v=to;
  if(from===to||window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.innerHTML=money(to);return}
  const t0=performance.now(),D=600;
  (function f(t){const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.innerHTML=money(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0);
}
function oldCount(){const d=oldDays();let n=0;db.buyers.forEach(b=>{const i=debtInfo(b);if(i.bal>0.004&&i.ageDays>=d)n++});return n}
function renderTotal(){

/* v5: الشريط يتابع «النسخة الكاملة» (JSON) لا ملف Excel، لأن Excel ملخص ولا يُستعاد منه */
function backupNag(){
  const now=Date.now();
  const lastFullDay = store.get(K.fullBk,'');
  const snooze=store.get(K.snooze,0);
  const first = store.get(K.first, now);
  let msg = '';
  if(db.buyers.length>0 && dateStr(now) !== dateStr(first)){
    if(!lastFullDay){
      const days = Math.floor((now - first)/864e5);
      if(days >= 2) msg = 'لم تُصدَّر نسخة كاملة منذ بدء الاستخدام. صدّر نسخة كاملة الآن.';
    } else {
      const [y,m,d] = String(lastFullDay).split('-').map(Number);
      const lastTs = new Date(y, m-1, d).getTime();
      const days = Math.floor((now - lastTs)/864e5);
      if(days >= 2) msg = 'مرّ '+days+' أيام على آخر نسخة كاملة. صدّر نسخة كاملة الآن.';
    }
  }
  if(now < snooze) msg = '';
  return msg;
}
function renderBanner(){
  const msg=backupNag();
  $('#banner').innerHTML = msg ? '<div class="banner" role="alert"><span>'+ic('download')+'</span><div class="t"><b>احتفظ بنسخة كاملة</b>'+msg+'</div><div style="display:grid;gap:4px"><button type="button" data-act="exportBackup">الآن</button><button type="button" class="later" data-act="snooze">لاحقاً</button></div></div>' : '';
  if(curSec==='main')renderMain();
}
/* v11: إحصائيات سجل المعاملات (مستعادة من v2): ديون/تسديدات هذا الشهر، أكثر 5 مدينين، آخر 6 أشهر */
function renderLedStats(){
  const now=new Date(),ym=now.getFullYear()*12+now.getMonth();
  let md=0,mp=0;const months=[];
  for(let i=5;i>=0;i--){const k=ym-i;months.push({k,m:((k%12)+12)%12,d:0,p:0})}
  db.buyers.forEach(b=>b.txs.forEach(t=>{
    if(t.void)return;const dd=new Date(t.date),k=dd.getFullYear()*12+dd.getMonth();
    const m=months.find(x=>x.k===k);if(m){if(t.type==='debt')m.d+=t.amount;else m.p+=t.amount}
    if(k===ym){if(t.type==='debt')md+=t.amount;else mp+=t.amount}
  }));
  const top=db.buyers.map(b=>({b,bal:balanceOf(b)})).filter(r=>r.bal>0.004).sort((a,c)=>c.bal-a.bal).slice(0,5);
  const topMax=top.length?top[0].bal:1;
  const mx=Math.max(1,...months.map(m=>Math.max(m.d,m.p)));
  $('#ledStats').innerHTML=
    '<div class="stat2"><div class="stat d"><small>'+ic('up','sm')+'ديون هذا الشهر</small><b class="red">'+money(round2(md))+'</b></div><div class="stat p"><small>'+ic('down','sm')+'تسديدات هذا الشهر</small><b class="green">'+money(round2(mp))+'</b></div></div>'+
    '<div class="card"><h3>'+ic('users')+'أكثر 5 مدينين</h3>'+(top.length?top.map(r=>'<div class="hbar"><span class="nm">'+esc(r.b.name)+'</span><span class="tr"><i style="width:'+Math.max(4,r.bal/topMax*100)+'%"></i></span><b class="red">'+money(r.bal)+'</b></div>').join(''):'<div class="empty" style="padding:18px">لا توجد ديون قائمة 🎉</div>')+'</div>'+
    '<div class="card"><h3>'+ic('chart')+'آخر 6 أشهر</h3><div class="cols">'+months.map(m=>'<div class="col"><div class="bars"><i class="d" style="height:'+(m.d/mx*100)+'%" title="ديون"></i><i class="p" style="height:'+(m.p/mx*100)+'%" title="تسديدات"></i></div><span>'+MONTHS[m.m]+'</span></div>').join('')+'</div>'+
    '<div class="legend"><span><i style="background:var(--red)"></i>ديون</span><span><i style="background:var(--green)"></i>تسديدات</span></div></div>';
}
function setLtab(t){
  ui.ltab=t==='stats'?'stats':'list';
  const st=ui.ltab==='stats';
  document.querySelectorAll('#ltabs [data-act="ltab"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===ui.ltab)));
  ['#ledTools','#filters','#list'].forEach(s=>{const e=$(s);if(e)e.hidden=st});
  $('#ledStats').hidden=!st;

  if(st)renderLedStats();
}
function renderFilters(){
  const F=[['all','الكل'],['debt','رصيد عليه'],['old','ديون قديمة'],['over','تجاوزوا الحد'],['credit','رصيد له'],['paid','المسدَّدون']];
  $('#filters').innerHTML=F.map(f=>'<button type="button" class="fchip" data-act="filter" data-v="'+f[0]+'" aria-pressed="'+(ui.filter===f[0])+'">'+f[1]+'</button>').join('');
}
function renderHome(){
  renderTotal();renderBanner();renderFilters();
  if(ui.ltab==='stats')renderLedStats();
  const q=norm(ui.q);
  const OD=oldDays();
  let rows=db.buyers.map(b=>{const di=debtInfo(b);return {b,di,bal:di.bal,last:lastActivity(b)}});
  if(q)rows=rows.filter(r=>norm(r.b.name).includes(q));
  if(ui.filter==='debt')rows=rows.filter(r=>r.bal>0.004);
  else if(ui.filter==='old')rows=rows.filter(r=>r.bal>0.004&&r.di.ageDays>=OD);
  else if(ui.filter==='over')rows=rows.filter(r=>r.bal>0.004&&r.bal>=limitOf(r.b));
  else if(ui.filter==='credit')rows=rows.filter(r=>r.bal<-0.004);
  else if(ui.filter==='paid')rows=rows.filter(r=>Math.abs(r.bal)<0.005);
  if(ui.sort==='debt')rows.sort((a,c)=>c.bal-a.bal||a.b.name.localeCompare(c.b.name,'ar'));
  else if(ui.sort==='oldest')rows.sort((a,c)=>(c.bal>0.004?c.di.ageDays:-1)-(a.bal>0.004?a.di.ageDays:-1)||c.bal-a.bal);
  else if(ui.sort==='recent')rows.sort((a,c)=>c.last-a.last);
  else rows.sort((a,c)=>a.b.name.localeCompare(c.b.name,'ar'));
  const L=$('#list');
  if(!rows.length){
    L.innerHTML=db.buyers.length?'<div class="empty"><div class="ill">'+ic('search')+'</div><h3>لا نتائج</h3><div>جرّب تغيير البحث أو التصفية</div></div>':

    return;
  }
  L.innerHTML=rows.map((r,i)=>{
    const [a,c]=hueOf(r.b.name);
    const cls=r.bal>0.004?'red':r.bal<-0.004?'green':'zero';
    return '<div class="buyer" role="listitem" style="animation-delay:'+Math.min(i,10)*30+'ms"><button type="button" class="b-open" data-act="open" data-id="'+esc(r.b.id)+'" aria-expanded="'+(ui.detail===r.b.id)+'">'+
      '<span class="av" style="--a:'+a+';--b:'+c+'">'+esc(letter(r.b.name))+'</span>'+
      '<span class="b-info"><b>'+esc(r.b.name)+'</b><small>'+r.b.txs.filter(t=>!t.void).length+' حركة'+(r.bal>0.004&&r.di.oldest?' · <span class="age-tag '+ageCls(r.di.ageDays)+'">'+ic('hourglass','sm')+' '+daysTxt(r.di.ageDays)+'</span>':(r.di.lastPay?' · آخر تسديد '+daysTxt((Date.now()-r.di.lastPay)/864e5):''))+'</small></span>'+
      '<span class="b-bal '+cls+'">'+signed(r.bal)+'<small>'+(r.bal>0.004?'رصيد عليه':r.bal<-0.004?'رصيد له':'')+'</small></span></button>'+
      '<div class="b-addrow"><button type="button" class="b-add" data-act="quickAdd" data-id="'+esc(r.b.id)+'" aria-label="إضافة حركة لـ '+esc(r.b.name)+'">'+ic('plus','sm')+'إضافة حركة</button></div></div>';
  }).join('');
}

function debtStatusHtml(t,p){
  const pct=Math.max(0,Math.min(100,p.paid/t.amount*100));
  let st,cls;
  if(p.rem<=0.004){st='مسدَّد بالكامل';cls='st-done'}
  else if(p.paid>0.004){st='سُدِّد '+fmt(p.paid)+' · تبقّى '+fmt(p.rem)+' ₪';cls='st-part'}
  else{st='مفتوح — لم يُسدَّد منه شيء';cls='st-open'}
  const age=p.rem>0.004?' · '+daysTxt((Date.now()-t.date)/864e5):'';
  return '<div class="dbt-st"><span class="mm" aria-hidden="true"><i style="width:'+pct+'%"></i></span><b class="'+cls+'">'+st+'</b><span>'+age+'</span></div>';
}

function inputsToTs(dateV,timeV){
  const ds = dateV || dateStr(Date.now());
  const ts = timeV || '00:00';
  const [y,m,d] = ds.split('-').map(Number);
  const [hh,mm] = ts.split(':').map(Number);
  return new Date(y, m-1, d, hh||0, mm||0, 0, 0).getTime();
}

function submitTx(){
  const b=cur();if(!b)return;
  const amt=parseNum($('#fAmt').value);
  if(!(amt>0)){toast('أدخل مبلغاً صحيحاً أكبر من صفر','err');$('#fAmt').focus();return}
  const note=$('#fNote').value.trim().slice(0,80);
  const dateV = $('#fDate').value || dateStr(Date.now());
  const timeV = $('#fTime').value || p2(new Date().getHours())+':'+p2(new Date().getMinutes());
  const when = inputsToTs(dateV, timeV);
  const before=balanceOf(b);
  if(!ui.editId&&!ui.dupOk){   // v10: حماية من الإدخال المكرّر (نفس المشتري والنوع والمبلغ والبيان خلال 20 ثانية)
    const L=ui.lastSub,nowMs=Date.now();
    if(L&&L.b===b.id&&L.type===ui.type&&L.amt===amt&&L.note===note&&nowMs-L.at<20000){
      confirmBox({title:'حركة مكرّرة؟',ok:'سجّلها مرة أخرى',msg:'سجّلت للتو حركة مطابقة ('+(ui.type==='debt'?'دين ':'تسديد ')+fmt(amt)+' ₪). هل تريد تسجيلها مرة أخرى؟',onOk:()=>{ui.dupOk=true;try{submitTx()}finally{ui.dupOk=false}}});
      return;
    }
  }
  if(!ui.editId)ui.lastSub={b:b.id,type:ui.type,amt,note,at:Date.now()};
  if(ui.editId){
    const t=b.txs.find(x=>x.id===ui.editId);
    if(t){t.type=ui.type;t.amount=amt;t.note=note;t.date=when}
    ui.editId=null;toast('تم تعديل الحركة','ok');
  }else{
    const _nt={id:uid(),type:ui.type,amount:amt,note,date:when,void:false};b.txs.push(_nt);
    if(ui.type==='debt')v9Commit('form',b,_nt);   // v9: خصم البضاعة من المخزون
    toast(ui.type==='debt'?'تم تسجيل الدين':'تم تسجيل التسديد','ok');
  }
  if(note) bumpNote(note);
  persist();haptic(18);
  checkAlert(b,before,balanceOf(b));
  renderForm();afterChange();
  // فحص الحفظ اليومي بعد الإدخال
  checkDailyExport();
}
function voidTx(id){
  const b=cur(),t=b&&b.txs.find(x=>x.id===id);if(!t||t.void)return;
  const before=balanceOf(b);t.void=true;if(ui.editId===id){ui.editId=null;renderForm()}
  persist();haptic(25);afterChange();
  toast('أُلغيت الحركة','info',()=>{const bb=balanceOf(b);t.void=false;persist();checkAlert(b,bb,balanceOf(b));afterChange()});
}
function restoreTx(id){

function purgeTx(id){

  const fit=(txt,maxW)=>{if(x.measureText(txt).width<=maxW)return txt;let s=Array.from(txt);while(s.length>1&&x.measureText(s.join('')+'…').width>maxW)s.pop();return s.join('')+'…'};
  const T=(txt,X,Y,font,color,al)=>{x.font=font;x.fillStyle=color;x.textAlign=al||'right';x.fillText(txt,X,Y)};

  x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=2;x.beginPath();x.moveTo(padX,184);x.lineTo(W-padX,184);x.stroke();
  T('كشف حساب المشتري',W-padX,214,'500 24px '+F,'rgba(255,255,255,.75)');

  x.fillStyle=col.bg;rr(padX,boxY,W-padX*2,boxH,36);x.fill();
  x.lineWidth=4;x.strokeStyle=col.bd;rr(padX,boxY,W-padX*2,boxH,36);x.stroke();
  x.fillStyle=col.bd;rr(W-padX-14,boxY+36,14,boxH-72,7);x.fill();
  T('الرصيد النهائي',W-padX-48,boxY+52,'500 28px '+F,col.tx);
  T(col.lb,padX+44,boxY+52,'500 24px '+F,col.tx,'left');

async function hashPin(pin,salt){
  try{if(window.crypto&&crypto.subtle){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return Array.from(new Uint8Array(d)).map(b=>p2(b.toString(16))).join('')}}catch(e){}
  let h=5381;const s=salt+':'+pin;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+h;
}
async function verifyPin(pin){const r=store.get(K.pin,null);return !!r&&(await hashPin(pin,r.s))===r.h}

async function padKey(k){
  if(!pad)return;
  if(k==='del'){padBuf=padBuf.slice(0,-1);padDots();return}
  if(padBuf.length>=4)return;
  padBuf+=k;padDots();haptic(8);
  if(padBuf.length===4){
    const pin=padBuf;let r;try{r=await pad.cb(pin)}catch(e){r={err:'حدث خطأ'}}
    if(r==='ok')hidePad();
    else if(r&&r.next)showPad(r.next);
    else{const d=$('#padDots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}$('#padSub').textContent=(r&&r.err)||'';padBuf='';setTimeout(padDots,120);haptic(60)}

/* ---------- تطبيع البيانات ---------- */
function normInv(o){
  const out={items:[],moves:[]};if(!o||typeof o!=='object')return out;
  const ids=new Set();
  (Array.isArray(o.items)?o.items:[]).forEach(i=>{
    if(!i||typeof i.name!=='string'||!i.name.trim())return;
    const id=typeof i.id==='string'&&i.id&&!ids.has(i.id)?i.id:uid();ids.add(id);
    const price=Number(i.price);
    out.items.push({id,name:i.name.trim().replace(/\s+/g,' ').slice(0,60),barcode:String(i.barcode==null?'':i.barcode).trim().slice(0,64),
      price:price>=0&&price<=1e9?round2(price):0,cost:Number(i.cost)>0&&Number(i.cost)<=1e9?round2(Number(i.cost)):0,
      min:Math.max(0,Math.min(1e6,Math.floor(Number(i.min)||0))),created:Number(i.created)||Date.now()});
  });
  const mids=new Set();
  (Array.isArray(o.moves)?o.moves:[]).forEach(m=>{
    if(!m||!ids.has(m.itemId)||!['in','out','adj'].includes(m.type))return;
    let qty=Number(m.qty);if(!isFinite(qty)||qty===0||Math.abs(qty)>1e9)return;
    qty=m.type==='adj'?round2(qty):round2(Math.abs(qty));if(qty===0)return;
    const id=typeof m.id==='string'&&m.id&&!mids.has(m.id)?m.id:uid();mids.add(id);
    const r=m.ref&&typeof m.ref==='object'?{b:String(m.ref.b||'').slice(0,80),t:String(m.ref.t||'').slice(0,80),name:String(m.ref.name||'').slice(0,60)}:null;
    out.moves.push({id,itemId:m.itemId,type:m.type,qty,price:Number(m.price)>=0?round2(Number(m.price)):0,cost:Number(m.cost)>0&&Number(m.cost)<=1e9?round2(Number(m.cost)):0,date:Number(m.date)||Date.now(),note:String(m.note||'').slice(0,100),ref:r&&r.t?r:null});
  });
  return out;
}
function normSafeLegacy(a){   // الخزنة أُزيلت في v12؛ تبقى الدالة لترحيل المبيعات النقدية القديمة إلى فواتير
  return (Array.isArray(a)?a:[]).map(e=>{
    if(!e||(e.type!=='in'&&e.type!=='out'))return null;
    const amount=Number(e.amount);if(!(amount>0)||amount>1e9)return null;
    return {id:typeof e.id==='string'&&e.id?e.id:uid(),type:e.type,amount:round2(amount),note:String(e.note||'').slice(0,80),date:Number(e.date)||Date.now(),
      mv:Array.isArray(e.mv)?e.mv.filter(x=>typeof x==='string').slice(0,200):[]};
  }).filter(Boolean);
}

function liveSet(){const s=new Set();db.buyers.forEach(b=>b.txs.forEach(t=>{if(!t.void)s.add(t.id)}));invc.list.forEach(i=>{if(i.pay==='cash'&&!i.void)s.add(i.id)});return s}   // v12: بضاعة الفاتورة النقدية الملغاة تعود للمخزون تلقائياً
const mLive=(m,live)=>!m.ref||!m.ref.t||live.has(m.ref.t);

function stockMap(){const live=liveSet(),o={};inv.moves.forEach(m=>{if(mLive(m,live))o[m.itemId]=round2((o[m.itemId]||0)+sQty(m))});return o}

/* ---------- v12: بيانات الفواتير ---------- */
function normInvoices(o){
  const out={next:1,list:[]};if(!o||typeof o!=='object'||Array.isArray(o))return out;
  const ids=new Set();
  (Array.isArray(o.list)?o.list:[]).forEach(i=>{
    if(!i||(i.pay!=='cash'&&i.pay!=='debt'))return;
    const total=Number(i.total);if(!(total>0)||total>1e9)return;
    const id=typeof i.id==='string'&&i.id&&!ids.has(i.id)?i.id:uid();ids.add(id);
    const lines=(Array.isArray(i.lines)?i.lines:[]).map(l=>{
      if(!l||typeof l.name!=='string')return null;
      const qty=Number(l.qty),price=Number(l.price),c=Number(l.cost);
      if(!(qty>0)||qty>1e9||!(price>=0)||price>1e9)return null;
      return {itemId:typeof l.itemId==='string'?l.itemId.slice(0,80):'',name:l.name.slice(0,60),qty:round2(qty),price:round2(price),cost:c>0&&c<=1e9?round2(c):0};
    }).filter(Boolean).slice(0,300);
    out.list.push({id,no:Math.max(0,Math.floor(Number(i.no))||0),date:Number(i.date)||Date.now(),pay:i.pay,
      buyerId:typeof i.buyerId==='string'?i.buyerId.slice(0,80):'',name:String(i.name||'').slice(0,60),txId:typeof i.txId==='string'?i.txId.slice(0,80):'',
      total:round2(total),note:String(i.note||'').slice(0,80),lines,
      mv:Array.isArray(i.mv)?i.mv.filter(x=>typeof x==='string').slice(0,300):[],void:!!i.void});
  });
  const used=new Set();let mx=Math.max(0,Math.floor(Number(o.next)||1)-1);
  out.list.forEach(i=>{if(i.no>0&&!used.has(i.no)){used.add(i.no);mx=Math.max(mx,i.no)}else i.no=0});
  out.list.forEach(i=>{if(!i.no){mx++;i.no=mx}});
  out.next=mx+1;return out;
}
/* فاتورة الدين مرتبطة بحركة الدين في سجل المشتري؛ إن حُذفت الحركة أو المشتري لم يبقَ لها معنى فتُحذف */
function pruneInvoices(ivc,dbx){
  const S=new Set();dbx.buyers.forEach(b=>b.txs.forEach(t=>{if(t.type==='debt')S.add(b.id+'|'+t.id)}));
  ivc.list=ivc.list.filter(i=>i.pay!=='debt'||S.has(i.buyerId+'|'+i.txId));
  return ivc;
}
/* ترحيل: كل «بيع نقدي» قديم في الخزنة يصبح فاتورة «دفع فوري» (الإيداعات والمصاريف لا تُنقل) */
function safeToInvoices(sf,iv,ivc){
  const byId=new Map(iv.moves.map(m=>[m.id,m]));
  sf.slice().sort((a,b)=>a.date-b.date).forEach(e=>{
    if(e.type!=='in'||!e.mv.length)return;
    const id=uid(),lines=[];
    e.mv.forEach(mid=>{
      const m=byId.get(mid);if(!m||m.type!=='out')return;
      const it=iv.items.find(x=>x.id===m.itemId);
      if(!(m.cost>0)&&it&&it.cost>0)m.cost=it.cost;
      lines.push({itemId:m.itemId,name:it?it.name:'صنف',qty:m.qty,price:m.price,cost:m.cost>0?m.cost:0});
      m.ref={b:'',t:id,name:'بيع فوري'};
    });
    ivc.list.push({id,no:ivc.next++,date:e.date,pay:'cash',buyerId:'',name:'',txId:'',total:e.amount,note:e.note==='بيع نقدي'?'':e.note,lines,mv:e.mv.slice(),void:false});
  });
  return ivc;
}

/* ربح تقديري = (سعر البيع − سعر الشراء) × الكمية، للأصناف المسجَّل لها سعر شراء فقط */
function profitStats(from){
  const live=liveSet();let rev=0,profit=0,covered=0;
  inv.moves.forEach(m=>{
    if(m.type!=='out'||m.date<from||!mLive(m,live))return;
    const c=moveCost(m,itemById(m.itemId)),r=m.qty*m.price;rev+=r;
    if(c>0){profit+=m.qty*(m.price-c);covered+=r}
  });
  return {profit:round2(profit),cover:rev>0?Math.round(covered/rev*100):-1};
}

}

/* ======================================================================
   مسح الباركود بكاميرا الويب عبر html5-qrcode
   - تُحمَّل المكتبة عند أول ضغطة على الزر فقط (لا تثقل الإقلاع).
   - تحاول أولاً نسخة محلية assets/vendor/html5-qrcode.min.js (تعمل بلا إنترنت)،
     ثم CDN كاحتياط.
   ====================================================================== */
const QR_LIB_SOURCES=[
  '/assets/vendor/html5-qrcode.min.js',                                        // اختياري: انسخ الملف هنا ليعمل أوفلاين
  'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'        // CDN (مثبّت على إصدار)
];
let qrLibPromise=null;

/** يحمّل المكتبة مرة واحدة ويرجع Promise. يجرّب المصادر بالترتيب. */
function loadQrLib(){
  if(window.Html5Qrcode)return Promise.resolve();
  if(qrLibPromise)return qrLibPromise;
  qrLibPromise=new Promise((resolve,reject)=>{
    let i=0;
    const next=()=>{
      if(i>=QR_LIB_SOURCES.length){qrLibPromise=null;reject(new Error('LIB_LOAD_FAILED'));return}
      const s=document.createElement('script');
      s.src=QR_LIB_SOURCES[i++];
      s.onload=()=>window.Html5Qrcode?resolve():next();
      s.onerror=()=>{s.remove();next()};
      document.head.appendChild(s);
    };
    next();
  });
  return qrLibPromise;
}

/** يحوّل أي خطأ من الكاميرا/المكتبة إلى رسالة عربية مفهومة. */
function camErrText(e){
  const n=(e&&e.name)||'',m=String((e&&e.message)||e||'');
  if(m==='LIB_LOAD_FAILED')return 'تعذّر تحميل مكتبة المسح. تأكد من الاتصال بالإنترنت أو ضع الملف محلياً في assets/vendor، أو اكتب الباركود يدوياً.';
  if(m==='NO_MEDIA_API')return 'هذا المتصفح/الاتصال لا يدعم الكاميرا (يلزم HTTPS أو localhost). اكتب الباركود يدوياً.';
  if(m==='NO_CAMERA'||n==='NotFoundError'||n==='OverconstrainedError'||/requested device not found/i.test(m))
    return 'لا توجد كاميرا متاحة في هذا الجهاز. استخدم قارئاً خارجياً أو اكتب الباركود يدوياً.';
  if(n==='NotAllowedError'||n==='SecurityError'||/permission|denied/i.test(m))
    return 'تم رفض إذن الكاميرا. اسمح بالوصول للكاميرا من إعدادات المتصفح (أيقونة القفل بجانب العنوان) ثم أعد المحاولة.';
  if(n==='NotReadableError'||n==='AbortError'||/could not start video source/i.test(m))
    return 'الكاميرا مستخدمة من تطبيق آخر. أغلقه ثم أعد المحاولة.';
  return 'تعذّر تشغيل الكاميرا: '+(m||n||'خطأ غير معروف');
}

/**
 * قارئ كاميرا مرتبط بنافذة إدخال الباركود.
 * root   : عنصر النافذة (modal.el)
 * onCode : تُستدعى مرة واحدة فقط بالقيمة المقروءة (بعد إيقاف الكاميرا)
 */
function makeCamScanner(root,onCode){
  const box=$('#mcCamBox',root),btn=$('#mcCamBtn',root),msg=$('#mcCamMsg',root);
  let scanner=null,running=false,starting=false,handled=false;

  const say=(t,err)=>{msg.textContent=t||'';msg.className='cam-msg'+(t?' on':'')+(err?' err':'')};

  /** يوقف الكاميرا ويحرّر الموارد (آمن للاستدعاء عدة مرات). */
  async function stop(){
    const s=scanner;scanner=null;
    if(s){
      try{if(running)await s.stop()}catch(e){}
      try{s.clear()}catch(e){}
    }
    running=false;
    box.hidden=true;
    btn.disabled=false;
  }

  /** يبدأ الكاميرا. */
  async function start(){
    if(running||starting)return;
    starting=true;handled=false;btn.disabled=true;say('جارٍ تشغيل الكاميرا…');
    try{
      // 1) بيئة آمنة + دعم getUserMedia
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('NO_MEDIA_API');
      // 2) المكتبة
      await loadQrLib();
      // 3) وجود كاميرا + طلب الإذن (يرمي NotAllowedError عند الرفض)
      const cams=await Html5Qrcode.getCameras();
      if(!cams||!cams.length)throw new Error('NO_CAMERA');

      box.hidden=false;
      const F=Html5QrcodeSupportedFormats;
      scanner=new Html5Qrcode('mcReader',{
        formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.QR_CODE],
        experimentalFeatures:{useBarCodeDetectorIfSupported:true},   // أسرع حيث يدعمه المتصفح
        verbose:false
      });
      await scanner.start(
        {facingMode:'environment'},                                   // الكاميرا الخلفية، وتتراجع لأي كاميرا (حاسوب)
        {
          fps:10,
          // إطار مستطيل عريض يناسب الباركود الشريطي
          qrbox:(w,h)=>({width:Math.floor(Math.min(w,480)*.9),height:Math.floor(Math.min(h,320)*.5)})
        },
        async text=>{                                                 // نجاح القراءة
          if(handled)return;handled=true;                             // حارس من التكرار (الكاميرا تلتقط عدة إطارات)
          await stop();                                               // إيقاف الكاميرا فوراً
          say('');

        },

      );

    }catch(e){
      await stop();

    }finally{starting=false;if(!running)btn.disabled=false}
  }

  btn.addEventListener('click',start);

  return{stop};
}

  try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=beep.c||(beep.c=new A());const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=1100;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.07)}catch(e){}
}

function routeScan(code,src){

/* قارئ الباركود الخارجي (USB / بلوتوث) يعمل كلوحة مفاتيح: يكتب الأرقام بسرعة كبيرة ثم Enter.
   نلتقط الدفعة السريعة في أي شاشة دون الحاجة لتركيز خانة معيّنة، ونعيد للحقل قيمته قبل المسح. */
const wedge={buf:'',last:0,fast:0,el:null,startVal:null,timer:null};
function wedgeReset(){clearTimeout(wedge.timer);wedge.buf='';wedge.fast=0;wedge.el=null;wedge.startVal=null}
function wedgeFire(){
  const code=wedge.buf,el=wedge.el,sv=wedge.startVal;
  if(el&&sv!==null&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){try{el.value=sv;el.dispatchEvent(new Event('input',{bubbles:true}))}catch(_){}}
  wedgeReset();routeScan(code,'kb');
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  const t=e.target;
  if(t&&t.classList&&(t.classList.contains('stk-code')||t.id==='whIn'))return;   // لها معالج Enter خاص
  if(!$('#lock').hidden)return;
  const k=e.key;
  if(k==='Enter'||k==='Tab'){
    if(wedge.buf.length>=4&&wedge.fast>=wedge.buf.length-1){e.preventDefault();e.stopPropagation();wedgeFire()}
    else wedgeReset();
    return;
  }
  if(!k||k.length!==1)return;
  const now=performance.now();
  if(!wedge.buf||now-wedge.last>60){wedge.buf=k;wedge.fast=0;wedge.el=t;wedge.startVal=(t&&typeof t.value==='string')?t.value:null}
  else{wedge.buf+=k;wedge.fast++}
  wedge.last=now;
  clearTimeout(wedge.timer);
  wedge.timer=setTimeout(()=>{if(wedge.buf.length>=8&&wedge.fast>=wedge.buf.length-1)wedgeFire();else wedgeReset()},90);   // قارئات بلا Enter
},true);

  const m=itemByCode(code);formMatch=null;nm.readOnly=false;hint.hidden=true;hint.className='stk-hint';
  if(!m)return;
  if(formEd){ if(m.id!==formEd.id){hint.hidden=false;hint.className='stk-hint err';hint.textContent='هذا الباركود مستخدم لصنف آخر: «'+m.name+'»'} return }
  formMatch=m;nm.value=m.name;nm.readOnly=true;if(!$('#iPrice').value)$('#iPrice').value=m.price||'';
  hint.hidden=false;hint.textContent='الصنف موجود: «'+m.name+'» (المتوفر '+stockOf(m.id)+') — الكمية التي تدخلها تُضاف إلى مخزونه.';
}
function saveItemForm(){
  const name=$('#iName').value.trim().replace(/\s+/g,' ').slice(0,60),code=$('#iBar').value.trim().slice(0,64);
  const pv=$('#iPrice').value.trim(),price=pv===''?0:parseNum(pv),mv=($('#iMin').value||'').trim(),min=mv===''?0:Math.floor(parseNum(mv));
  const cv=($('#iCost').value||'').trim(),cost=cv===''?0:parseNum(cv);
  if(isNaN(price)||isNaN(min)||isNaN(cost)){toast('تحقق من السعر وحد التنبيه','err');return false}
  const now=Date.now();
  if(formEd){
    if(!name){toast('اكتب اسم الصنف','err');return false}
    const o=itemByCode(code);if(o&&o.id!==formEd.id){toast('الباركود مستخدم لصنف آخر','err');return false}
    formEd.name=name;formEd.barcode=code;formEd.price=price;formEd.cost=cost;formEd.min=min;
    saveInv();toast('تم تعديل الصنف','ok');refreshSec();if(itemModal&&!itemModal.closed)setTimeout(()=>openItem(formEd.id),0);return;
  }
  const qv=($('#iQty').value||'').trim(),qty=qv===''?0:parseNum(qv);
  if(isNaN(qty)){toast('الكمية غير صحيحة','err');return false}
  if(formMatch){
    if(!(qty>0)){toast('أدخل الكمية المراد إضافتها','err');return false}
    if(pv!=='')formMatch.price=price;if(cv!=='')formMatch.cost=cost;
    inv.moves.push({id:uid(),itemId:formMatch.id,type:'in',qty,price:formMatch.price,date:now,note:'',ref:null});
    saveInv();toast('أُضيفت الكمية إلى «'+formMatch.name+'»','ok');haptic(18);refreshSec();return;
  }
  if(!name){toast('اكتب اسم الصنف','err');return false}
  const it={id:uid(),name,barcode:code,price,cost,min,created:now};inv.items.push(it);
  if(qty>0)inv.moves.push({id:uid(),itemId:it.id,type:'in',qty,price,date:now,note:'إضافة أولية',ref:null});
  saveInv();toast('تمت إضافة الصنف','ok');haptic(18);refreshSec();
}
function qtyForm(id,adjust){
  const it=itemById(id);if(!it)return;const cur=stockOf(id);
  openModal({title:(adjust?'جرد / تصحيح — ':'إضافة كمية — ')+it.name,body:
    '<label class="fld"><span>'+(adjust?'الكمية الفعلية الموجودة الآن (المسجّل: '+cur+')':'الكمية المضافة')+'</span><input id="qtyV" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></label>'+
    '<label class="fld"><span>ملاحظة (اختياري)</span><input id="qtyN" type="text" maxlength="60" autocomplete="off"></label>',
    actions:[{label:'إلغاء',cls:'ghost',cancel:true},{label:'حفظ',cls:'primary',fn:()=>{
      const v=parseNum($('#qtyV').value);if(isNaN(v)||(!adjust&&!(v>0))){toast('أدخل كمية صحيحة','err');return false}
      const note=($('#qtyN').value||'').trim().slice(0,60);
      if(adjust){const d=round2(v-cur);if(d===0){toast('لا فرق عن المسجّل','info');return}inv.moves.push({id:uid(),itemId:id,type:'adj',qty:d,price:it.price,date:Date.now(),note,ref:null})}
      else inv.moves.push({id:uid(),itemId:id,type:'in',qty:v,price:it.price,date:Date.now(),note,ref:null});
      saveInv();haptic(18);toast('تم الحفظ','ok');refreshSec();setTimeout(()=>openItem(id),0);
    }}]});
}
function delItem(id){
  const it=itemById(id);if(!it)return;
  confirmBox({title:'حذف الصنف',danger:true,ok:'حذف',msg:'سيُحذف «'+esc(it.name)+'» مع كل سجل حركاته. هل أنت متأكد؟',onOk:()=>{
    inv.items=inv.items.filter(i=>i.id!==id);inv.moves=inv.moves.filter(m=>m.itemId!==id);saveInv();
    if(itemModal&&!itemModal.closed)itemModal.close();toast('تم حذف الصنف','info');refreshSec();}});
}

/* ---------- سلة البيع (تظهر عند تسجيل دين، وفي البيع النقدي) ---------- */
const cartBox=ctx=>document.querySelector('.stk-cart[data-ctx="'+ctx+'"]');
const cartTotal=ctx=>round2(carts[ctx].reduce((s,l)=>s+l.qty*l.price,0));
function renderCart(ctx){
  const box=cartBox(ctx);if(!box)return;const L=carts[ctx];
  box.innerHTML='<div class="stk-h">'+ic('box','sm')+'<b>بضاعة من المخزون</b><small>(اختياري — تُخصم من المخزون عند الحفظ)</small></div>'+
    '<div class="stk-btns"><button type="button" class="btn ghost" data-stk="scan" data-ctx="'+ctx+'">'+ic('scan','sm')+'مسح باركود</button><button type="button" class="btn ghost" data-stk="pick" data-ctx="'+ctx+'">'+ic('box','sm')+'من المخزون</button></div>'+
    '<input class="stk-code" type="text" inputmode="numeric" autocomplete="off" data-ctx="'+ctx+'" placeholder="أو اكتب الباركود ثم Enter" aria-label="الباركود">'+
    (L.length?L.map((l,i)=>{const it=itemById(l.id);return '<div class="stk-line"><div class="n"><b>'+esc(it?it.name:'؟')+'</b><small>'+money(l.price)+' × '+qtyTxt(l.qty)+' = '+money(round2(l.qty*l.price))+'</small></div>'+
      '<div class="st"><button type="button" data-stk="cartQty" data-ctx="'+ctx+'" data-i="'+i+'" data-d="-1" aria-label="إنقاص">−</button><b>'+qtyTxt(l.qty)+'</b><button type="button" data-stk="cartQty" data-ctx="'+ctx+'" data-i="'+i+'" data-d="1" aria-label="زيادة">+</button></div>'+
      '<button type="button" class="x" data-stk="cartDel" data-ctx="'+ctx+'" data-i="'+i+'" aria-label="حذف">'+ic('close','sm')+'</button></div>'}).join('')+'<div class="stk-total"><span>مجموع البضاعة</span><span>'+money(cartTotal(ctx))+'</span></div>':'');
}
function cartSync(ctx){
  renderCart(ctx);const L=carts[ctx],c=CTX[ctx],a=$(c.amt),n=$(c.note);
  if(a&&L.length){a.value=String(cartTotal(ctx));a.dispatchEvent(new Event('input',{bubbles:true}))}
  if(n){const auto=L.map(l=>{const it=itemById(l.id);return it?it.name:''}).filter(Boolean).join('، ').slice(0,80);
    if(n.value===''||n.value===cartAuto[ctx]){n.value=auto;cartAuto[ctx]=auto}}
}
function cartAdd(ctx,id){
  const it=itemById(id);if(!it)return;const st=stockOf(id),L=carts[ctx],ex=L.find(l=>l.id===id),q=(ex?ex.qty:0)+1;
  if(q>st){toast('المتوفر من «'+it.name+'»: '+st,'err');return}
  if(ex)ex.qty=q;else L.push({id,qty:1,price:it.price});
  haptic(12);cartSync(ctx);
}
function cartScan(ctx,code){const it=itemByCode(code);if(!it){toast('هذا الباركود غير مسجّل في المخزون','err');return}cartAdd(ctx,it.id)}
function openPicker(ctx){
  pkCtx=ctx;
  openModal({title:'اختر من المخزون',sheet:true,focus:false,body:'<div class="stk-search"><input id="pkQ" type="search" placeholder="ابحث بالاسم" autocomplete="off"></div><div id="pkList"></div>',actions:[{label:'إغلاق',cls:'ghost',cancel:true}]});

}
function pkRender(){
  const el=$('#pkList');if(!el)return;const q=norm(($('#pkQ')||{}).value),st=stockMap();
  const rows=inv.items.filter(i=>(st[i.id]||0)>0&&(!q||norm(i.name).includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'ar'));

function v9FormInit(editing){
  const seg=$('#txForm .seg');if(!seg)return;
  if(editing||cartOwner!==ui.detail){carts.form=[];cartAuto.form=''}
  cartOwner=ui.detail;
  if(editing)return;
  seg.insertAdjacentHTML('afterend','<div class="stk-cart" data-ctx="form"></div>');renderCart('form');

function v9QuickInit(){carts.quick=[];cartAuto.quick='';renderCart('quick')}
/* خصم البضاعة من المخزون وإرجاع أسطر الفاتورة. ref يربط الحركة بحركة الدين أو بالفاتورة النقدية فتعود الكمية عند الإلغاء */
function cartMoves(ctx,ref,date){
  const ids=[],lines=[];
  carts[ctx].forEach(l=>{
    const it=itemById(l.id);if(!it)return;
    const id=uid(),c=it.cost>0?it.cost:0;ids.push(id);
    inv.moves.push({id,itemId:it.id,type:'out',qty:l.qty,price:l.price,cost:c,date,note:'',ref:ref?Object.assign({},ref):null});
    lines.push({itemId:it.id,name:it.name,qty:l.qty,price:l.price,cost:c});
  });
  carts[ctx]=[];cartAuto[ctx]='';if(ids.length)saveInv();
  return {ids,lines};
}
/* كل دين جديد = فاتورة «دين» مرتبطة بحركته (سواء كانت معها بضاعة أم لا) */
function v9Commit(ctx,b,t){
  const r=cartMoves(ctx,{b:b.id,t:t.id,name:b.name},t.date);
  addInvoice({pay:'debt',buyerId:b.id,name:b.name,txId:t.id,total:t.amount,note:t.note,date:t.date,lines:r.lines,mv:r.ids});
  return r.ids;
}

/* ---------- v12: صفحة الفواتير ---------- */
let ivF='all',ivQ='';
const IV_FILTERS=[['all','الكل'],['cash','دفع فوري'],['debt','دين'],['void','ملغاة']];
const ivName=i=>i.name||'بيع فوري';
function ivFiltered(){
  const q=norm(ivQ),qn=ivQ.trim().replace(/^#/,'');
  return invList().filter(i=>ivF==='all'?true:ivF==='void'?i.void:(!i.void&&i.pay===ivF))
    .filter(i=>!q||norm(ivName(i)).includes(q)||norm(i.note).includes(q)||String(i.no)===qn)
    .sort((a,b)=>b.date-a.date||b.no-a.no);
}
function ivRowsHtml(){
  const all=ivFiltered(),rows=all.slice(0,200),dc=new Map();
  if(!rows.length)return '<div class="empty"><div class="ill">'+ic('receipt')+'</div><h3>'+(invc.list.length?'لا نتائج':'لا توجد فواتير بعد')+'</h3><div>'+(invc.list.length?'جرّب تغيير البحث أو التصفية':'اضغط «فاتورة جديدة» لتسجيل أول عملية بيع')+'</div></div>';
  return rows.map((i,k)=>{
    let st='';
    if(i.pay==='debt'&&!i.void&&i._b){
      let di=dc.get(i._b.id);if(!di){di=debtInfo(i._b);dc.set(i._b.id,di)}
      const p=di.per[i._t.id];
      if(p)st=p.rem<=0.004?' · <span class="green">مسدَّدة</span>':p.paid>0.004?' · <span style="color:var(--warn)">مسدَّدة جزئياً</span>':' · <span class="red">غير مسدَّدة</span>';
    }
    return '<button type="button" class="invrow'+(i.void?' void':'')+'" data-iv="open" data-id="'+esc(i.id)+'" style="animation-delay:'+Math.min(k,8)*25+'ms"><span class="no">#'+i.no+'</span>'+
      '<span class="t"><b>'+esc(ivName(i))+'<span class="ptag '+(i.void?'void':i.pay)+'">'+(i.void?'ملغاة':i.pay==='cash'?'دفع فوري':'دين')+'</span></b>'+
      '<small>'+esc(dateStr(i.date)+' · '+timeStr(i.date))+(i.lines.length?' · '+i.lines.length+' بند':'')+st+'</small></span>'+
      '<span class="a">'+money(i.total)+'</span></button>';
  }).join('')+(all.length>rows.length?'<p class="note">يُعرض أحدث 200 فاتورة من '+all.length+'. استخدم البحث للوصول لغيرها.</p>':'');
}
function invoicesHtml(){
  const live=invList().filter(i=>!i.void);
  const cash=round2(live.filter(i=>i.pay==='cash').reduce((s,i)=>s+i.total,0)),debt=round2(live.filter(i=>i.pay==='debt').reduce((s,i)=>s+i.total,0));
  return '<button type="button" class="btn block bigbtn gold" data-qa="invoice" style="margin-bottom:12px;width:100%">'+ic('plus')+'فاتورة جديدة</button>'+
    '<div class="mmeta" style="margin:0 0 12px"><div>عدد الفواتير<b>'+live.length+'</b></div><div>دفع فوري<b>'+money(cash)+'</b></div><div>دين<b>'+money(debt)+'</b></div></div>'+
    '<div class="stk-search"><input id="ivQ" type="search" placeholder="ابحث بالاسم أو رقم الفاتورة" value="'+esc(ivQ)+'" autocomplete="off"></div>'+
    '<div class="chips-row" role="group" aria-label="تصفية الفواتير">'+IV_FILTERS.map(f=>'<button type="button" class="fchip" data-ivf="'+f[0]+'" aria-pressed="'+(ivF===f[0])+'">'+f[1]+'</button>').join('')+'</div>'+
    '<div id="ivList">'+ivRowsHtml()+'</div>';

function invoiceText(i){
  const f=n=>fmt(n)+' شيكل';
  return 'فاتورة #'+i.no+' — '+(settings.project||'حسابك')+'\n'+
    'التاريخ: '+dateStr(i.date)+' '+timeStr(i.date)+'\n'+
    (i.pay==='debt'?'المشتري: ':'الزبون: ')+ivName(i)+'\n'+
    'طريقة الدفع: '+(i.pay==='cash'?'دفع فوري':'دين (آجل)')+'\n'+
    (i.lines.length?'— الأصناف —\n'+i.lines.map(l=>'• '+l.name+' × '+round2(l.qty)+' = '+f(round2(l.qty*l.price))).join('\n')+'\n':'')+
    (i.note&&!i.lines.length?'البيان: '+i.note+'\n':'')+
    'الإجمالي: '+f(i.total);
}
function setInvVoid(id,v){
  const raw=invc.list.find(x=>x.id===id);if(!raw)return;
  if(raw.pay==='debt'){
    const r=txOfInv(raw);if(!r)return;
    const before=balanceOf(r.b);r.t.void=v;persist();checkAlert(r.b,before,balanceOf(r.b));
  }else{raw.void=v;saveInvc()}
  haptic(18);toast(v?'أُلغيت الفاتورة':'تمت استعادة الفاتورة','info');refreshSec();
}
function purgeInvoice(id){
  const raw=invc.list.find(x=>x.id===id);if(!raw||raw.pay!=='cash')return;
  const s=new Set(raw.mv);
  invc.list=invc.list.filter(x=>x.id!==id);
  if(s.size){inv.moves=inv.moves.filter(m=>!s.has(m.id));saveInv()}
  saveInvc();toast('تم حذف الفاتورة نهائياً','info');refreshSec();
}
function openInvoice(id){
  const raw=invc.list.find(x=>x.id===id),i=raw&&invView(raw);if(!i)return;
  const sum=round2(i.lines.reduce((s,l)=>s+l.qty*l.price,0)),diff=round2(i.total-sum);
  let st='';
  if(i.pay==='debt'&&!i.void&&i._b){
    const p=debtInfo(i._b).per[i._t.id];
    if(p)st=p.rem<=0.004?'هذه الفاتورة مسدَّدة بالكامل':p.paid>0.004?'سُدِّد '+fmt(p.paid)+' ₪ وتبقّى '+fmt(p.rem)+' ₪':'لم يُسدَّد منها شيء بعد';
  }
  const body=
    '<div class="ivmeta"><div>رقم الفاتورة<b>#'+i.no+'</b></div><div>التاريخ<b>'+esc(dateStr(i.date)+' · '+timeStr(i.date))+'</b></div>'+
      '<div>طريقة الدفع<b class="'+(i.pay==='cash'?'green':'red')+'">'+(i.pay==='cash'?'دفع فوري':'دين (آجل)')+'</b></div>'+
      '<div>'+(i.pay==='cash'?'الزبون':'المشتري')+'<b>'+esc(ivName(i))+'</b></div></div>'+
    (i.void?'<div class="stk-hint err">هذه الفاتورة ملغاة ولا تُحتسب'+(i.pay==='cash'?' (وعادت بضاعتها إلى المخزون)':'')+'</div>':'')+
    (st?'<div class="stk-hint">'+esc(st)+'</div>':'')+
    (i.lines.length?i.lines.map(l=>'<div class="ivl"><span>'+esc(l.name)+'<small>'+money(l.price)+' × '+qtyTxt(l.qty)+'</small></span><b>'+money(round2(l.qty*l.price))+'</b></div>').join('')+
      (Math.abs(diff)>0.004?'<div class="ivl"><span>فرق / بنود أخرى</span><b>'+smoney(diff)+'</b></div>':'')+(i.note?'<div class="note">البيان: '+esc(i.note)+'</div>':''):
      '<div class="ivl"><span>'+esc(i.note||'بدون تفاصيل أصناف')+'</span><b>'+money(i.total)+'</b></div>')+
    '<div class="ivtot"><span>الإجمالي</span><span>'+money(i.total)+'</span></div>'+
    (i.pay==='debt'&&i._b?'<button type="button" class="rowlink" style="margin:12px 0 0" data-iv="buyer" data-id="'+esc(i._b.id)+'">'+ic('users')+'<span>فتح سجل «'+esc(i._b.name)+'»</span><span class="chev">'+ic('back','sm')+'</span></button>':'');
  const acts=[];
  if(!i.void){
    acts.push({label:'مشاركة',cls:'primary',fn:()=>{shareText('فاتورة #'+i.no,invoiceText(i));return false}});
    acts.push({label:'إلغاء الفاتورة',cls:'danger',fn:()=>{confirmBox({title:'إلغاء الفاتورة #'+i.no,ok:'إلغاء الفاتورة',
      msg:i.pay==='debt'?'ستُلغى الفاتورة وحركة الدين المرتبطة بها في سجل المشتري، ويعود رصيده كما كان.':'ستُلغى الفاتورة وتعود بضاعتها إلى المخزون. يمكنك استعادتها لاحقاً.',
      onOk:()=>setInvVoid(id,true)})}});
  }else{
    acts.push({label:'استعادة',cls:'primary',fn:()=>{setInvVoid(id,false)}});
    if(i.pay==='cash')acts.push({label:'حذف نهائي',cls:'danger',fn:()=>{confirmBox({title:'حذف نهائي',ok:'حذف',msg:'ستُحذف الفاتورة نهائياً من السجل.',onOk:()=>purgeInvoice(id)})}});
  }
  openModal({title:'فاتورة #'+i.no,sheet:true,focus:false,body,actions:acts});
}

/* ---------- v10: التقارير المالية المبسطة ---------- */
const RP_RANGES=[['today','اليوم'],['week','7 أيام'],['month','هذا الشهر'],['year','هذه السنة'],['all','الكل']];
let rpSel='month';
function rpStart(k){
  const d=new Date();d.setHours(0,0,0,0);
  if(k==='today')return d.getTime();
  if(k==='week'){d.setDate(d.getDate()-6);return d.getTime()}
  if(k==='month'){d.setDate(1);return d.getTime()}
  if(k==='year'){d.setMonth(0,1);return d.getTime()}
  return 0;
}
function agingBuckets(){
  const B=[{l:'0–30 يوماً',max:30,v:0,c:'var(--green)'},{l:'31–60 يوماً',max:60,v:0,c:'var(--warn)'},{l:'61–90 يوماً',max:90,v:0,c:'#e0803a'},{l:'أكثر من 90',max:1e9,v:0,c:'var(--red)'}];
  db.buyers.forEach(b=>debtInfo(b).open.forEach(o=>{const x=B.find(z=>o.days<=z.max);x.v+=o.rem}));
  B.forEach(x=>x.v=round2(x.v));return B;
}
function reportData(k){
  const from=rpStart(k),live=liveSet();
  let debtNew=0,paid=0,cashSales=0,nInv=0;
  db.buyers.forEach(b=>b.txs.forEach(t=>{if(t.void||t.date<from)return;if(t.type==='debt')debtNew+=t.amount;else paid+=t.amount}));
  invList().forEach(i=>{if(i.void||i.date<from)return;nInv++;if(i.pay==='cash')cashSales+=i.total});
  const sold={};let rev=0,profit=0,covered=0;
  inv.moves.forEach(m=>{
    if(m.type!=='out'||m.date<from||!mLive(m,live))return;
    const it=itemById(m.itemId);if(!it)return;
    const c=moveCost(m,it),r=m.qty*m.price;rev+=r;
    const e=sold[it.id]||(sold[it.id]={it,qty:0,rev:0});e.qty+=m.qty;e.rev+=r;
    if(c>0){profit+=m.qty*(m.price-c);covered+=r}
  });
  return {from,debtNew:round2(debtNew),paid:round2(paid),cashSales:round2(cashSales),nInv,sales:round2(debtNew+cashSales),profit:round2(profit),cover:rev>0?Math.round(covered/rev*100):0,
    top:Object.values(sold).sort((x,y)=>y.qty-x.qty).slice(0,5)};
}
function reportBars(k){
  const daily=k==='today'||k==='week',cols=[],now=new Date();
  if(daily){for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);cols.push({from:d.getTime(),to:d.getTime()+864e5,l:DAYS[d.getDay()].slice(0,5),d:0,p:0})}}
  else{for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);cols.push({from:d.getTime(),to:new Date(d.getFullYear(),d.getMonth()+1,1).getTime(),l:MONTHS[d.getMonth()],d:0,p:0})}}
  db.buyers.forEach(b=>b.txs.forEach(t=>{if(t.void)return;const c=cols.find(x=>t.date>=x.from&&t.date<x.to);if(c){if(t.type==='debt')c.d+=t.amount;else c.p+=t.amount}}));
  const mx=Math.max(1,...cols.map(c=>Math.max(c.d,c.p)));
  return '<div class="cols">'+cols.map(c=>'<div class="col"><div class="bars"><i class="d" style="height:'+(c.d/mx*100)+'%" title="ديون"></i><i class="p" style="height:'+(c.p/mx*100)+'%" title="تسديدات"></i></div><span>'+esc(c.l)+'</span></div>').join('')+'</div>'+
    '<div class="legend"><span><i style="background:var(--red)"></i>ديون جديدة</span><span><i style="background:var(--green)"></i>تسديدات</span></div>';
}

  inv.items.forEach(i=>{const q=Math.max(0,st[i.id]||0);val+=q*i.price;costVal+=q*(i.cost>0?i.cost:0)});
  const net=round2(debts-credit);

    '<div class="card"><h3>'+ic('users')+'أكبر المدينين</h3>'+(top.length?top.map(x=>'<div class="rank"><span class="n">'+esc(x.b.name)+'<small>'+(x.di.oldest?'أقدم دين '+daysTxt(x.di.ageDays):'')+'</small></span><b class="red">'+money(x.di.bal)+'</b></div>').join(''):'<div class="empty" style="padding:14px">لا يوجد</div>')+'</div>'+
    '<div class="card"><h3>'+ic('box')+'المخزون</h3>'+(r.top.length?'<div style="font-size:13px;color:var(--mute);margin-bottom:4px">الأكثر مبيعاً في الفترة</div>'+r.top.map(x=>'<div class="rank"><span class="n">'+esc(x.it.name)+'</span><b>'+qtyTxt(x.qty)+' · '+money(round2(x.rev))+'</b></div>').join(''):'<div style="color:var(--mute);font-size:14px;margin-bottom:6px">لا مبيعات من المخزون في هذه الفترة.</div>')+

}

function phoneAudit(){

    const key=digitsOf(b.phoneIntl);

    const p=pfxOfIntl(b.phoneIntl,true);
    if(!p)issues.push({b,why:'مقدمة غير موجودة في قائمتك: '+b.phoneIntl});
    else if(key.length-pfxDigits(p).length<7)issues.push({b,why:'رقم قصير: '+b.phoneIntl});

  else if(a==='del'){if(PFX.list.length<=1)return;PFX.list=PFX.list.filter(x=>x!==v);if(PFX.def===v)PFX.def=PFX.list[0];savePfx();pfxRender()}
  else if(a==='add'||a==='addNew'){
    let p=a==='add'?v:String($('#pfxNew').value||'').replace(/\s+/g,'').replace(/^00/,'+');
    if(p&&!p.startsWith('+'))p='+'+p;
    if(!PFX_RE.test(p)){toast('اكتب المقدمة بالشكل +970','err');return}
    if(PFX.list.includes(p)){toast('المقدمة موجودة','info');return}
    if(PFX.list.length>=12){toast('الحد الأقصى 12 مقدمة','err');return}
    PFX.list.push(p);savePfx();pfxRender();
  }
  else if(a==='audit'){pfxView='audit';pfxRender()}
  else if(a==='list'){pfxView='list';pfxRender()}
  else if(a==='edit'){
    while(modals.length)modals[modals.length-1].close();
    goSec('ledger');setTimeout(()=>{openDetail(v,true);editBuyer()},60);
  }
});

/* ---------- أحداث ---------- */
function stkAct(a,el){
  const id=el.getAttribute('data-id'),ctx=el.getAttribute('data-ctx');
  switch(a){
    case 'addItem':openItemForm({});break;
    case 'scanInv':scanBarcode(c=>routeScan(c,'cam'));break;
    case 'wholesale':openWholesale();break;
    case 'whCam':whCam(false);break;
    case 'whCamEx':whCam(true);break;
    case 'whUndo':whUndo(id);break;
    case 'whSaveNew':whSaveNew();break;
    case 'whSkipNew':whSkipNew();break;
    case 'item':openItem(id);break;
    case 'addQty':qtyForm(id,false);break;
    case 'adjust':qtyForm(id,true);break;
    case 'editItem':openItemForm({id});break;
    case 'delItem':delItem(id);break;
    case 'scanInto':scanBarcode(c=>{const b=$('#iBar');if(b){b.value=c;formLookup()}});break;
    case 'scan':scanBarcode(c=>cartScan(ctx,c));break;
    case 'pick':openPicker(ctx);break;
    case 'pickItem':{const top=modals[modals.length-1];cartAdd(pkCtx,id);if(top)top.close();break}
    case 'cartQty':{const L=carts[ctx],l=L[+el.dataset.i];if(!l)break;const q=l.qty+(+el.dataset.d);
      if(q<=0){L.splice(+el.dataset.i,1)}else{if(q>stockOf(l.id)){toast('لا توجد كمية أكبر في المخزون','err');break}l.qty=q}cartSync(ctx);break}
    case 'cartDel':carts[ctx].splice(+el.dataset.i,1);cartSync(ctx);break;
  }
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){goSec(g.getAttribute('data-go'));return}
  const q=e.target.closest('[data-qa]');
  if(q){
    const v=q.getAttribute('data-qa');
    if(v==='invoice')newInvoice();
    else if(v==='pay')pickBuyer(id=>quickAdd(id,'pay'));
    return;
  }
  const pp=e.target.closest('[data-pp]');
  if(pp){mainP=pp.getAttribute('data-pp');renderMain();return}
  const ivf=e.target.closest('[data-ivf]');
  if(ivf){ivF=ivf.getAttribute('data-ivf');renderPage('invoices');return}
  const ivb=e.target.closest('[data-iv]');
  if(ivb){
    const k=ivb.getAttribute('data-iv'),id=ivb.getAttribute('data-id');
    if(k==='open')openInvoice(id);
    else if(k==='buyer'){const top=modals[modals.length-1];if(top)top.close();setTimeout(()=>openDetail(id,true),40)}
    return;
  }
  const at=e.target.closest('[data-att]');
  if(at){
    const v=at.getAttribute('data-att');
    if(v==='old'){ui.filter='old';goSec('ledger')}
    else if(v==='inv')goSec('inv');
    else if(v==='backup')confirmDownload('json',exportFullBackup);
    return;
  }
  const rp=e.target.closest('[data-rp]');
  if(rp){rpSel=rp.getAttribute('data-rp');renderPage('reports');return}
  if(e.target.closest('[data-rp-share]')){shareText('تقرير '+(settings.project||'حسابك'),reportText(rpSel));return}
  const pb=e.target.closest('[data-pb]');
  if(pb){const id=pb.getAttribute('data-pb'),cb=pbCb;pbCb=null;const top=modals[modals.length-1];if(top)top.close();if(cb)cb(id);return}
  const k=e.target.closest('[data-stk]');if(k)stkAct(k.getAttribute('data-stk'),k);
});
/* Enter داخل خانة الباركود (قارئ خارجي أو كتابة يدوية): التقاط مبكر كي لا يحفظ النموذج/النافذة */
document.addEventListener('keydown',e=>{
  const t=e.target;if(e.key!=='Enter'||!t||!t.classList)return;
  if(t.classList.contains('stk-code')){e.preventDefault();e.stopPropagation();const v=t.value.trim();t.value='';if(v){beep();cartScan(t.getAttribute('data-ctx'),v)}}
  else if(t.id==='whIn'){e.preventDefault();e.stopPropagation();const v=t.value.trim();t.value='';if(v)routeScan(v,'kb')}
},true);
document.addEventListener('input',e=>{
  if(e.target.id==='invQ'){invQ=e.target.value;const pos=e.target.selectionStart;$('#pgBody').innerHTML=invHtml();const n=$('#invQ');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
  else if(e.target.id==='pkQ')pkRender();
  else if(e.target.id==='ivQ'){ivQ=e.target.value;const L=$('#ivList');if(L)L.innerHTML=ivRowsHtml()}
  else if(e.target.id==='pbQ')pbRender();
  else if(e.target.id==='whPack'){const v=parseNum(e.target.value);if(v>0&&v<=100000){prefs.pack=v;savePrefs()}whPerTxt()}
  else if(e.target.id==='whBoxes'){const v=parseNum(e.target.value);wh.boxes=v>0?v:1;whPerTxt()}
});
document.addEventListener('change',e=>{if(e.target.id==='iBar')formLookup()});

/* ---------- v12: زر الرجوع (أندرويد يستدعيها) ----------
   يرجع خطوة واحدة: نافذة ← تفاصيل مشتري ← الشاشة الرئيسية. وفي الرئيسية يسأل «هل تريد الخروج؟» بدل إغلاق التطبيق مباشرة. */
window.hesabakBack=function(){
  try{
    if($('#lock')&&!$('#lock').hidden)return 'bg';
    if(modals.length){modals[modals.length-1].dismiss();return 'ok'}
    if($('#detail').classList.contains('open')){goBack();return 'ok'}
    if(curSec!=='main'){goSec('main');return 'ok'}
    confirmExit();return 'ok';
  }catch(e){return 'none'}
};
function confirmExit(){
  openModal({title:'الخروج من التطبيق',focus:false,body:'<div class="m-ic warn">'+ic('alert','lg')+'</div><p style="text-align:center;font-size:17px">هل تريد الخروج من التطبيق؟</p>',
    actions:[{label:'البقاء',cls:'ghost',cancel:true},{label:'خروج',cls:'danger',fn:()=>{
      const B=window.Android;
      if(B&&typeof B.exitApp==='function'){try{B.exitApp()}catch(e){}}else{try{window.close()}catch(e){}}
    }}]});
}

/* ---------- v12/v13: رسالة النسخ الاحتياطي (تظهر عند كل فتح للتطبيق) ---------- */
let bkIntroOpen=false;
const BK_INTRO_GAP_MS=5*60*1000;   // v13: تُعرض أيضاً عند العودة للتطبيق بعد أكثر من 5 دقائق في الخلفية
function showBackupIntro(){
  if(bkIntroOpen)return;
  bkIntroOpen=true;
  const app=!!(window.Android&&typeof window.Android.saveFile==='function');
  const api=openModal({title:'⚠️ تنبيه مهم',focus:false,body:
    '<div class="bk-ic">'+ic('save')+'</div>'+
    '<h2>لا تخسر بياناتك!<br>احتفظ بنسخة احتياطية</h2>'+
    '<p>كل ما تسجّله هنا (المشترون، الديون، الفواتير، المخزون) محفوظ <b>على هذا الهاتف فقط</b>. إذا حُذف التطبيق، أو ضاع الهاتف أو تعطّل، أو مُسحت بيانات التطبيق من إعدادات الهاتف، تضيع بياناتك ولا يمكن استرجاعها إلا من نسخة احتياطية محفوظة خارج التطبيق.</p>'+
    '<div class="bk-box"><b>✅ ما يفعله التطبيق تلقائياً</b>'+(app?'يحفظ كل يوم نسخة من بياناتك في مجلد <bdi dir="ltr">Downloads/Hesabak-data</bdi> على الهاتف، حتى لو كان التطبيق مغلقاً.':'يحتفظ بنسخ داخلية سريعة لآخر 3 أيام للتراجع.')+'</div>'+
    '<div class="bk-box warn"><b>📌 المطلوب منك</b>صدّر «نسخة كاملة» وأرسلها إلى واتساب أو البريد أو Google Drive من وقت لآخر (مرة في الأسبوع على الأقل). النسخة التي على الهاتف نفسه تضيع معه إن ضاع أو تعطّل.</div>'+
    '<p style="font-size:14px;color:var(--mute)">للتصدير: الإعدادات ← تصدير نسخة كاملة. وللاسترجاع: الإعدادات ← استرجاع نسخة كاملة.</p>',
    actions:[{label:'فهمت',cls:'ghost',cancel:true},{label:'تصدير نسخة الآن',cls:'primary',fn:()=>{setTimeout(()=>confirmDownload('json',exportFullBackup),60)}}],
    onClose:()=>{bkIntroOpen=false}});
  api.el.classList.add('bk-intro');
}

function v9Boot(){
  loadV9();
  applySec('main');
  setTimeout(introWhenReady,400);   // v13: في كل فتح (كانت مرة واحدة فقط)
}
/* إن كان التطبيق مقفلاً بـ PIN تُعرض الرسالة بعد فتح القفل */
function introWhenReady(){
  if(bkIntroOpen)return;
  const lk=$('#lock');
  if(lk&&!lk.hidden){const prev=ui.afterPad;ui.afterPad=()=>{if(prev)prev();setTimeout(showBackupIntro,300)};return}
  showBackupIntro();
}

function init(){
  try{localStorage.removeItem('ledger_msg_v1')}catch(e){}   // v13: بيانات الرسائل الجماعية القديمة
  if(!store.get(K.first,0))store.set(K.first,Date.now());
  // الثيم الافتراضي فاتح إذا لم يكن محدَّداً
  if(!store.get(K.theme,null)) store.set(K.theme,'light');
  loadData();applyTheme();renderProject();renderBadge();renderBar();
  $('#sortSel').value=ui.sort;
  try{history.replaceState({},'')}catch(e){}
  renderHome();v9Boot();
  checkAuto();tick();setInterval(tick,1000);
  if(store.get(K.pin,null))lockNow();
  setTimeout(checkDailyExport, 900);
  scheduleMirror(); // v7
}
init();
</script>
