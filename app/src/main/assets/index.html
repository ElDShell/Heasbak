<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>
/* منع وميض الثيم قبل تحميل CSS. القيم: light | dark | auto (حسب النظام) */
(function(){
  try{
    var raw = localStorage.getItem('ledger_theme');
    var t = raw ? JSON.parse(raw) : 'light';
    var dark = (t === 'dark');
    if(t === 'auto'){
      try{ dark = (window.Android && typeof Android.isSystemDark === 'function') ? !!Android.isSystemDark() : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) }catch(e){ dark = false }
    }
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#14213d">
<title>حسابك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --teal:#14213d;--teal2:#1f3a6b;--teal3:#2f5fb8;   /* v15: الأساس كحلي (navy) بدل التيل ليتناغم مع الأصفر الذهبي */
  --bg:#f5f3ec;--card:#ffffff;--ink:#14213d;--mute:#6a7186;--line:#e7e3d6;--soft:#f8f6f0;
  --red:#d64545;--red-bg:#fdecec;--green:#1a9466;--green-bg:#e4f6ee;--warn:#e0670f;--warn-bg:#fff0e3;
  --info:#2f5fb8;--info-bg:#e8effc;
  --focus:#2f5fb8;--shadow:0 10px 30px -14px rgba(20,33,61,.35);--shadow2:0 2px 8px -2px rgba(20,33,61,.12);
  --ov:rgba(6,20,20,.55);
  --hd1:#0e1a33;--hd2:#14213d;--hd3:#1f3a6b;--hd4:#2f5fb8;--hd-sh:rgba(20,33,61,.7);
  --nav:#ffffff;--r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:28px;
}
:root[data-theme="dark"]{
  --teal:#2a4a8f;--teal2:#3a63b8;--teal3:#7aa2ff;
  --bg:#0a1020;--card:#121a2e;--ink:#eaf0ff;--mute:#97a4c4;--line:#1e2a46;--soft:#172240;
  --red:#ff7a7a;--red-bg:#3a1b1d;--green:#4fd1a0;--green-bg:#123a2f;--warn:#ffa45c;--warn-bg:#3a2112;
  --info:#8fb2ff;--info-bg:#15233f;
  --focus:#8fb2ff;--shadow:0 10px 30px -14px rgba(0,0,0,.7);--shadow2:0 2px 8px -2px rgba(0,0,0,.5);--ov:rgba(0,0,0,.65);
  --hd1:#060b18;--hd2:#0d1630;--hd3:#142650;--hd4:#1f3a6b;--hd-sh:rgba(0,0,0,.8);--nav:#121a2e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
bdi{unicode-bidi:isolate}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}.ic.lg{width:28px;height:28px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:relative;background:linear-gradient(135deg,var(--hd1) 0%,var(--hd2) 35%,var(--hd3) 80%,var(--hd4) 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 20px;border-radius:0 0 30px 30px;box-shadow:0 14px 34px -16px var(--hd-sh);overflow:hidden}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.top::before{width:220px;height:220px;top:-90px;inset-inline-start:-60px}
.top::after{width:150px;height:150px;bottom:-70px;inset-inline-end:-30px}
.wrapc{max-width:600px;margin:0 auto;position:relative;z-index:1}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.brand h1{margin:0;font-size:20px;font-weight:700;line-height:1.2}
.brand p{margin:0;font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.top-actions{display:flex;gap:8px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.plain{background:var(--soft);border-color:var(--line);color:var(--ink)}
.badge{position:absolute;top:-5px;inset-inline-start:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff5a5a;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #0f4c4a}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6ff0b6;margin-inline-end:6px;box-shadow:0 0 0 4px rgba(111,240,182,.2)}

main{max-width:600px;margin:0 auto;padding:16px 16px calc(36px + env(safe-area-inset-bottom))}
body[data-sec="ledger"] main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.total{position:relative;margin-top:-4px;background:linear-gradient(145deg,var(--card),var(--soft));border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow);overflow:hidden}
.total::before{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(245,184,0,.2),transparent 70%)}
.total small{color:var(--mute);font-size:14px}
.total .big{font-size:42px;font-weight:700;line-height:1.15;margin:2px 0 14px;letter-spacing:-.5px}
.total .big.red{color:var(--red)}.total .big.green{color:var(--green)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.pill b{display:block;font-size:20px;line-height:1.2}
.pill span{font-size:12px;color:var(--mute)}
.banner{display:flex;gap:12px;align-items:center;margin-top:14px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink);padding:12px 14px;border-radius:18px}
.banner .t{flex:1;font-size:14px}.banner .t b{display:block}
.banner button{padding:8px 12px;border-radius:12px;background:var(--warn);color:#fff;font-weight:700;font-size:14px}
.banner .later{background:transparent;color:var(--mute);font-weight:500}
.tools{display:flex;gap:10px;margin:18px 0 10px}
.search{flex:1;position:relative}
.search .ic{position:absolute;top:50%;inset-inline-start:14px;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 44px;font-size:16px;box-shadow:var(--shadow2)}
.search input:focus{outline:none;border-color:var(--teal3);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal3) 22%,transparent)}
.sortsel{height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:14px;max-width:132px;box-shadow:var(--shadow2)}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.fchip{flex:none;height:38px;padding:0 16px;border-radius:19px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--mute);transition:.2s}
.fchip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 8px 16px -8px var(--teal)}
.list{display:grid;gap:10px}
.buyer{width:100%;display:block;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow2);animation:rise .35s both;overflow:hidden}
/* v3: بطاقة المشتري = منطقة فتح + صف زر «إضافة حركة» */
.b-open{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:start;padding:12px 14px 8px;transition:transform .15s}
.b-addrow{display:flex;justify-content:flex-end;padding:0 14px 12px}
.b-add{height:40px;padding:0 16px;border-radius:13px;background:var(--soft);border:1px solid var(--line);color:var(--teal3);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform .15s}
.b-add:active{transform:scale(.95)}
.phone-row{display:flex;gap:8px;direction:ltr;align-items:center}
.phone-row input{flex:1;min-width:0}
.b-open:active{transform:scale(.98)}
.av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 14px -8px var(--a)}
.av.lg{width:62px;height:62px;border-radius:20px;font-size:26px}
.b-info{min-width:0}
.b-info b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-info small{color:var(--mute);font-size:13px}
.b-bal{text-align:end;font-weight:700;font-size:18px;line-height:1.2}
.b-bal small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.red{color:var(--red)}.green{color:var(--green)}.zero{color:var(--mute)}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;background:var(--red-bg);color:var(--red);margin-inline-start:6px;vertical-align:middle}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:42px 20px;color:var(--mute)}
.empty .ill{width:96px;height:96px;margin:0 auto 12px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(47,95,184,.16),rgba(20,33,61,.08));color:var(--teal3)}
.empty .ill .ic{width:46px;height:46px}
.empty h3{margin:0 0 4px;color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow2);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{border-radius:22px;padding:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow2)}
.stat small{color:var(--mute);display:flex;align-items:center;gap:6px}
.stat b{display:block;font-size:24px;margin-top:4px}
.stat.d{background:linear-gradient(145deg,var(--card),var(--red-bg))}.stat.p{background:linear-gradient(145deg,var(--card),var(--green-bg))}
.hbar{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#e86a6a,var(--red));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;margin-top:6px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.col .bars{display:flex;gap:4px;align-items:flex-end;height:112px;width:100%;justify-content:center}
.col .bars i{width:42%;max-width:22px;border-radius:7px 7px 3px 3px;min-height:3px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.col .bars i.d{background:linear-gradient(180deg,var(--red),#e8888a)}.col .bars i.p{background:linear-gradient(180deg,var(--green),#6fd9b3)}
.col span{font-size:11px;color:var(--mute);text-align:center;line-height:1.1}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}

/* v12: أُزيل الشريط السفلي — التنقل من الشاشة الرئيسية وزر الرجوع */
.fab{position:fixed;z-index:31;inset-inline-end:max(18px,calc((100vw - 600px)/2 + 18px));bottom:calc(env(safe-area-inset-bottom) + 22px);width:60px;height:60px;border-radius:22px;background:linear-gradient(135deg,#ffd84d,#f5b800);color:#2a1c00;display:grid;place-items:center;box-shadow:0 16px 28px -10px rgba(224,159,0,.7);transition:transform .15s}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab .ic{width:28px;height:28px;stroke-width:2.4}

.detail{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateX(-100%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s}
.detail.open{transform:none;visibility:visible;transition-delay:0s}
.d-top{background:linear-gradient(135deg,var(--hd1),var(--hd3));color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px -12px rgba(0,0,0,.5)}
.d-top h2{flex:1;margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.d-wrap{max-width:600px;margin:0 auto;padding:16px}
.hero{border-radius:28px;padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(145deg,#14213d,#1f3a6b 70%,#2f5fb8)}
.hero.debt{background:linear-gradient(145deg,#7d1f27,#c23a3f 75%,#e06a62)}
.hero.credit{background:linear-gradient(145deg,#0d5a45,#14906a 75%,#3ec28f)}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1);inset-inline-start:-60px;bottom:-90px}
.hero-top{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.hero .av.lg{background:rgba(255,255,255,.2);box-shadow:none;border:1px solid rgba(255,255,255,.28)}
.hero small{opacity:.85}
.hero strong{display:block;font-size:34px;line-height:1.15}
.hero .meter{height:8px;border-radius:4px;background:rgba(255,255,255,.22);margin:14px 0 6px;overflow:hidden;position:relative;z-index:1}
.hero .meter i{display:block;height:100%;border-radius:4px;background:#fff;transition:width .6s}
.hero .mt{font-size:12px;opacity:.85;position:relative;z-index:1}
.hero-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;position:relative;z-index:1}
.hbtn.wide{grid-column:1/-1}
.hbtn{height:46px;border-radius:15px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.hbtn:active{transform:scale(.96)}
.form{margin-top:16px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:4px;margin-bottom:14px}
.seg-ind{position:absolute;top:4px;bottom:4px;inset-inline-start:4px;width:calc(50% - 4px);border-radius:14px;background:linear-gradient(135deg,#d64545,#e8706c);box-shadow:0 8px 16px -8px #d64545;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s}
.seg[data-type="pay"] .seg-ind{transform:translateX(-100%);background:linear-gradient(135deg,#14906a,#3ec28f);box-shadow:0 8px 16px -8px #14906a}
.seg button{position:relative;z-index:1;height:46px;border-radius:14px;font-weight:700;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .25s}
.seg button[aria-pressed="true"]{color:#fff}
.fld{display:block;margin-bottom:12px;position:relative}
.fld>span{display:block;font-size:13px;color:var(--mute);margin-bottom:6px;font-weight:500}
.fld input[type=text],.fld input[type=tel],.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld input:not([type]),.fld input[type=password]{width:100%;height:50px;border-radius:15px;border:1.5px solid var(--line);background:var(--soft);padding:0 14px;font-size:16px;transition:.2s}
.fld textarea{width:100%;min-height:120px;border-radius:15px;border:1.5px solid var(--line);background:var(--soft);padding:12px 14px;font-size:16px;line-height:1.6;resize:vertical;transition:.2s}
.fld textarea:focus{outline:none;border-color:var(--teal3);background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal3) 20%,transparent)}
.fld input:focus{outline:none;border-color:var(--teal3);background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal3) 20%,transparent)}
.fld-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amt{position:relative}
.amt input{font-size:24px!important;font-weight:700;height:60px!important;padding-inline-end:56px!important}
.amt em{position:absolute;top:50%;inset-inline-end:16px;transform:translateY(-50%);font-style:normal;color:var(--mute);font-weight:700;font-size:18px}
.chips-wrap{margin:-2px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--soft);border:1px solid var(--line);font-size:14px;color:var(--ink);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.chip:active{background:var(--teal);color:#fff}
.more-chips{height:34px;padding:0 14px;border-radius:17px;background:var(--teal);color:#fff;font-size:14px;font-weight:700;border:1px solid var(--teal);margin-top:8px}
.more-chips:active{transform:scale(.96)}
.ac-list{position:absolute;top:calc(100% + 4px);inset-inline:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:200px;overflow-y:auto;z-index:20;padding:4px}
.ac-item{display:block;width:100%;text-align:start;padding:10px 12px;border-radius:10px;font-size:15px;color:var(--ink)}
.ac-item:active{background:var(--soft)}
.note-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--soft);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;font-size:15px}
.note-item button{color:var(--teal3);font-weight:700;font-size:13px;padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.preview{min-height:46px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:15px;background:var(--soft);border:1px dashed var(--line);font-size:14px;color:var(--mute);margin-bottom:12px}
.preview.debt{background:var(--red-bg);border:1px solid transparent;color:var(--red)}
.preview.pay{background:var(--green-bg);border:1px solid transparent;color:var(--green)}
.preview b{color:inherit}
.btn{height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 12px 22px -12px var(--teal)}
.btn.danger{background:linear-gradient(135deg,#c93838,#e0605c);color:#fff;box-shadow:0 12px 22px -12px #c93838}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.form-actions{display:grid;grid-template-columns:1fr;gap:8px}
.form-actions.two{grid-template-columns:1fr 1fr}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec-title h3{margin:0;font-size:17px}.sec-title small{color:var(--mute)}
.tx{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow2);animation:rise .3s both}
.tx-main{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.tx-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.tx-ic.debt{background:var(--red-bg);color:var(--red)}.tx-ic.pay{background:var(--green-bg);color:var(--green)}
.tx-t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-t small{color:var(--mute);font-size:12px}
.tx-a{text-align:end;font-weight:700;font-size:17px;line-height:1.2}
.tx-a small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.tx.void .tx-t b,.tx.void .tx-a{text-decoration:line-through;opacity:.55}
.tx.void{background:var(--soft);border-style:dashed}
.tx-acts{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tx-acts button{flex:1;height:38px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.tx-acts button.dng{color:var(--red)}
.tx-acts button:active{transform:scale(.96)}

.modal{position:fixed;inset:0;z-index:100;background:var(--ov);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s both}
.modal.sheet{align-items:flex-end;padding:0}
.m-card{width:100%;max-width:520px;max-height:90dvh;background:var(--card);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both}
.modal.sheet .m-card{border-radius:28px 28px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:slideup .32s cubic-bezier(.2,.8,.2,1) both}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.m-head h3{margin:0;font-size:19px}
.m-head .icon-btn{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.m-body{padding:8px 18px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.m-body p{margin:0 0 10px;color:var(--ink)}
.m-foot{display:flex;gap:10px;padding:12px 18px 18px;border-top:1px solid var(--line)}
.m-foot .btn{flex:1}
.m-ic{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;margin:2px auto 12px}
.m-ic.red{background:var(--red-bg);color:var(--red)}
.m-ic.warn{background:var(--warn-bg);color:var(--warn)}
.m-ic.green{background:var(--green-bg);color:var(--green)}
.m-ic.info{background:var(--info-bg);color:var(--info)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.img-wrap{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff}
.img-wrap img{display:block;width:100%;height:auto}
.n-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:12px;border-radius:18px;background:var(--soft);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:.15s}
.n-item:active{transform:scale(.99)}
.n-item.unread{background:var(--card);border-color:var(--teal3);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal3) 14%,transparent)}
.n-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.n-ic.save{background:var(--green-bg);color:var(--green)}.n-ic.alert{background:var(--warn-bg);color:var(--warn)}.n-ic.info{background:var(--soft);color:var(--teal3)}.n-ic.file{background:var(--green-bg);color:var(--green)}
.n-item b{display:block;font-size:15px}.n-item p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.n-item time{font-size:11px;color:var(--mute);display:block;margin-top:4px}
.n-x{width:32px;height:32px;border-radius:10px;background:transparent;color:var(--mute);display:grid;place-items:center;flex:none}
.n-x:active{background:var(--line);color:var(--red)}
.set-sec{margin-bottom:16px}
.set-sec>h4{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:500}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--soft);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;width:100%;text-align:start}
.set-row .l{display:flex;align-items:center;gap:10px;font-weight:500}
.set-row .ic{color:var(--teal3)}
.set-row select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 8px}
.switch{position:relative;width:48px;height:28px;border-radius:14px;background:var(--line);transition:.25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:.25s}
.switch[aria-checked="true"]{background:#f5b800}
.switch[aria-checked="true"]::after{transform:translateX(-20px)}
.snap{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--soft);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;font-size:14px}
.snap button{padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--teal3)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
@keyframes slideup{from{transform:translateY(100%)}}

#toastRoot{position:fixed;z-index:300;inset-inline:12px;bottom:calc(env(safe-area-inset-bottom) + 24px);display:flex;justify-content:center;pointer-events:none}
.toast{pointer-events:auto;max-width:560px;width:100%;display:flex;align-items:center;gap:10px;background:#0c2a29;color:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 18px 36px -12px rgba(0,0,0,.6);animation:toastin .3s cubic-bezier(.2,.8,.2,1) both;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.toast.out{animation:toastout .25s both}
.toast .ti{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.toast.ok .ti{background:#14906a}.toast.err .ti{background:#d64545}.toast.info .ti{background:#2f5fb8}
.toast span.m{flex:1;font-size:15px}
.toast button{padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.16);font-weight:700;color:#7ff0cf;font-size:14px}
@keyframes toastin{from{opacity:0;transform:translateY(20px) scale(.96)}}
@keyframes toastout{to{opacity:0;transform:translateY(10px)}}

#lock{position:fixed;inset:0;z-index:500;background:linear-gradient(160deg,#0a1226,#14213d 55%,#2f5fb8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#lock .lk-ic{width:78px;height:78px;border-radius:26px;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);margin-bottom:14px}
#lock .lk-ic .ic{width:36px;height:36px}
#lock h2{margin:0;font-size:22px}
#lock .sub{opacity:.8;margin:4px 0 18px;min-height:24px;font-size:14px}
.dots{display:flex;gap:16px;margin-bottom:26px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.7);transition:.15s}
.dots i.on{background:#fff;transform:scale(1.1)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
.pad button{height:76px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-size:28px;font-weight:500;color:#fff;display:grid;place-items:center;transition:.12s}
.pad button:active{background:rgba(255,255,255,.35);transform:scale(.94)}
.pad button.ghost{background:none;border:0;font-size:15px}
#lock .lk-links{margin-top:22px;display:flex;gap:18px;font-size:14px;opacity:.85}
#lock .lk-links button{text-decoration:underline}

/* ===== v9: الشاشة الرئيسية + المخزون + الخزنة + التعليمات (إضافات فقط) ===== */
.mmeta{display:flex;gap:10px;margin-top:12px}
.mmeta div{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:8px 10px;text-align:center;font-size:12px;color:var(--mute)}
.mmeta b{display:block;font-size:15px;color:var(--ink)}
.stk-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.stk-actions.three{grid-template-columns:1fr 1fr 1fr}
.stk-actions .btn{height:48px;padding:0 8px;font-size:14px}
.itbl{display:grid;gap:8px}
.irow{display:grid;grid-template-columns:1.7fr .8fr .9fr 1fr;gap:6px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:14px;box-shadow:var(--shadow2)}
.irow.h{background:none;border:0;box-shadow:none;color:var(--mute);font-size:12px;font-weight:700;padding:0 12px}
.irow .nm{display:flex;flex-direction:column;min-width:0}
.irow .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .nm small{color:var(--mute);font-size:11px;direction:ltr;text-align:start}
.irow .qt{font-weight:700}
.irow .qt.low{color:var(--warn)}.irow .qt.out{color:var(--red)}
.irow .dt{font-size:11px;color:var(--mute)}
.stk-search{margin-bottom:12px}
.stk-search input{width:100%;height:48px;border-radius:15px;border:1.5px solid var(--line);background:var(--soft);padding:0 14px;font-size:16px}
.stk-head{text-align:center}
.stk-head .big{font-size:40px;font-weight:700;line-height:1.1}
.stk-head small{color:var(--mute)}
.stk-kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}
.stk-kv div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:12px;color:var(--mute);text-align:center}
.stk-kv b{display:block;color:var(--ink);font-size:15px;direction:ltr}
.stk-mv{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:14px}
.stk-mv.void{opacity:.5;text-decoration:line-through}
.stk-mv .t{flex:1;min-width:0}.stk-mv .t small{display:block;color:var(--mute);font-size:12px}
.stk-mv .q{font-weight:700;direction:ltr}.stk-mv .q.in{color:var(--green)}.stk-mv .q.out{color:var(--red)}
.stk-mv .r{display:block;color:var(--mute);font-size:11px;font-weight:400;text-align:end}
.stk-hint{background:var(--info-bg);color:var(--info);border-radius:12px;padding:8px 12px;margin:-4px 0 12px;font-size:13px}
.stk-hint.err{background:var(--red-bg);color:var(--red)}
.bar-row{display:flex;gap:8px}.bar-row input{flex:1;min-width:0}
.bar-row .btn{height:50px;padding:0 14px}
/* ===== مسح الباركود بكاميرا الويب (html5-qrcode) ===== */
.cam-btn{width:100%;height:48px;margin-bottom:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.cam-box{position:relative;margin-bottom:12px;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}
.cam-box[hidden]{display:none}
#mcReader{width:100%;min-height:220px}
#mcReader video{width:100%!important;height:auto!important;display:block}   /* بدون تشويه */
.cam-stop{position:absolute;top:8px;inset-inline-end:8px;z-index:2;height:36px;padding:0 14px;border-radius:12px;
  background:rgba(0,0,0,.6);color:#fff;font-size:14px;font-weight:700}
.cam-msg{display:none;margin-bottom:12px;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.6;
  background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.cam-msg.on{display:block}
.cam-msg.err{border-color:#c23a3f;color:#c23a3f}
.stk-cart{background:var(--soft);border:1px dashed var(--line);border-radius:18px;padding:12px;margin-bottom:14px}
.seg[data-type="pay"]+.stk-cart{display:none}
.stk-cart .stk-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.stk-cart .stk-h small{color:var(--mute)}
.stk-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stk-btns .btn{height:44px;font-size:14px;padding:0 8px}
.stk-code{width:100%;height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:15px}
.stk-line{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.stk-line .n{flex:1;min-width:0;font-size:14px}.stk-line .n small{display:block;color:var(--mute)}
.stk-line .st{display:flex;align-items:center;gap:4px}
.stk-line .st button{width:32px;height:32px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:18px;line-height:1}
.stk-line .st b{min-width:26px;text-align:center}
.stk-line .x{color:var(--red);width:30px;height:30px;display:grid;place-items:center}
.stk-total{display:flex;justify-content:space-between;margin-top:10px;font-weight:700}
.pk-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.pk-item small{color:var(--mute)}
.safe-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.safe-row .t{flex:1;min-width:0}.safe-row .t b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.safe-row .t small{color:var(--mute);font-size:12px}
.safe-row .a{font-weight:700;direction:ltr}.safe-row .a.in{color:var(--green)}.safe-row .a.out{color:var(--red)}
.safe-row .del{color:var(--mute);width:32px;height:32px;display:grid;place-items:center}
.help-card h3{margin:0 0 8px}.help-card p{margin:6px 0;line-height:1.8;color:var(--ink)}
.help-card ul{margin:6px 0;padding-inline-start:20px;line-height:1.9}
.help-card .ok{color:var(--green)}
/* ===== v10: هيكل موحّد (رأس واحد + تنقل سفلي واحد + أقسام) ===== */
select{font:inherit;color:inherit;max-width:100%}
#app{min-height:100dvh}
.view[hidden]{display:none!important}
.view{animation:rise .28s both}
.top-actions .icon-btn[hidden]{display:none}
.top-row .back{flex:none}
.brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
body:not([data-sec="ledger"]) .fab{display:none}
body.kb .fab{display:none}
.chev{color:var(--mute);margin-inline-start:auto;transform:scaleX(-1)}
.sec-h{margin:22px 4px 10px;font-size:14px;color:var(--mute);font-weight:700;display:flex;align-items:center;justify-content:space-between}
.sec-h button{color:var(--teal3);font-size:13px;font-weight:700}
.savecard{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;font-size:13px;margin-top:12px;box-shadow:var(--shadow2)}
.savecard b{font-weight:500;color:var(--mute)}
.savecard .btn-save{grid-row:1/3;grid-column:2;height:44px;padding:0 14px;border-radius:13px;background:linear-gradient(135deg,var(--hd2),var(--hd3));color:#fff;font-weight:700;display:flex;align-items:center;gap:6px}
.savecard .btn-save:active{transform:scale(.95)}
.fld select{width:100%;height:50px;border-radius:15px;border:1.5px solid var(--line);background:var(--soft);padding:0 12px;font-size:16px}
.phone-row select{height:50px;border-radius:15px;border:1.5px solid var(--line);background:var(--soft);padding:0 8px;font-weight:700;font-size:15px;color:var(--ink);flex:none;max-width:46%}

/* الشاشة الرئيسية */
.cash{position:relative;border-radius:26px;padding:20px;color:#fff;overflow:hidden;background:linear-gradient(145deg,var(--hd2),var(--hd3) 62%,var(--hd4));box-shadow:var(--shadow);margin-top:-4px}
.cash::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08);inset-inline-start:-70px;bottom:-100px;pointer-events:none}
.cash small{opacity:.88;font-size:14px;position:relative;z-index:1}
.cash .big{font-size:40px;font-weight:700;line-height:1.15;margin:2px 0 14px;position:relative;z-index:1}
.cash .kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.cash .kp div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:9px 10px;font-size:12.5px}
.cash .kp b{display:block;font-size:16px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 2px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink);padding:6px 0;text-align:center;line-height:1.3}
.qa .qi{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 12px 20px -12px var(--c1);transition:transform .15s}
.qa button:active .qi{transform:scale(.9)}
.att{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow2)}
.att:active{transform:scale(.99)}
.att .ai{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.att .ai.warn{background:var(--warn-bg);color:var(--warn)}.att .ai.red{background:var(--red-bg);color:var(--red)}.att .ai.info{background:var(--info-bg);color:var(--info)}.att .ai.green{background:var(--green-bg);color:var(--green)}
.att b{display:block;font-size:15px}.att small{color:var(--mute);font-size:13px}
.rowlink{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;font-weight:500;box-shadow:var(--shadow2)}
.rowlink:active{transform:scale(.99)}
.rowlink .ic{color:var(--teal3)}
.rowlink small{display:block;color:var(--mute);font-weight:400;font-size:12.5px}

/* إدارة الديون */
.age-tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--mute);margin-inline-start:4px}
.age-tag.w{background:var(--warn-bg);color:var(--warn)}.age-tag.r{background:var(--red-bg);color:var(--red)}
.dstat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;position:relative;z-index:1}
.dstat div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:8px 10px;font-size:12px;opacity:.98}
.dstat b{display:block;font-size:15px}
.dbt-st{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--mute)}
.dbt-st .mm{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.dbt-st .mm i{display:block;height:100%;background:var(--green);border-radius:3px}
.dbt-st b{font-weight:700}
.dbt-st .st-open{color:var(--red)}.dbt-st .st-part{color:var(--warn)}.dbt-st .st-done{color:var(--green)}
.payfull{height:34px;padding:0 14px;border-radius:17px;background:var(--green-bg);color:var(--green);font-weight:700;font-size:13.5px;margin:-4px 0 12px}
.age{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:13.5px}
.age .tr{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.age .tr i{display:block;height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* التقارير */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{border-radius:20px;padding:12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow2);min-width:0}
.kpi small{color:var(--mute);font-size:12.5px;display:flex;gap:6px;align-items:center}
.kpi b{display:block;font-size:19px;margin-top:2px;white-space:nowrap}
.kpi.in{background:linear-gradient(145deg,var(--card),var(--green-bg))}.kpi.out{background:linear-gradient(145deg,var(--card),var(--red-bg))}.kpi.wide{grid-column:1/-1}
.kpi .sub{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rank:first-of-type{border-top:0}
.rank .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .n small{display:block;color:var(--mute);font-size:12px}
.note{color:var(--mute);font-size:12px;margin:6px 4px 0;line-height:1.7}

/* v14: إضافة جملة (كانت «الاستلام السريع») */
.wh-in{display:flex;gap:8px;margin-bottom:10px}.wh-in input{flex:1;min-width:0;height:50px;border-radius:15px;border:1.5px solid var(--teal3);background:var(--soft);padding:0 14px;font-size:16px;direction:ltr;text-align:start}
.wh-in .btn{height:50px;padding:0 14px}
.wh-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.wh-btns .btn{height:50px;padding:0 8px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.wh-cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.wh-cfg label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute);font-weight:700}
.wh-cfg input{height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--soft);text-align:center;font-size:16px;color:inherit;min-width:0}
.wh-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:2px 2px 8px}
.wh-last{background:var(--green-bg);color:var(--green);border-radius:14px;padding:8px 12px;font-size:14px;margin-bottom:8px;font-weight:700}
.wh-last.err{background:var(--red-bg);color:var(--red)}
.pfx-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--soft);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.pfx-row .c{font-weight:700;direction:ltr;min-width:52px}.pfx-row .nm{flex:1;color:var(--mute);font-size:13.5px}
.pfx-row button{padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--teal3)}
.pfx-row button.dng{color:var(--red)}
.pfx-row .dflt{background:var(--teal3);color:#fff;border-color:var(--teal3)}


/* ===== v12: الفواتير بدل الخزنة + شاشة رئيسية جديدة + تنبيه النسخ الاحتياطي ===== */
/* v15: الأصفر الذهبي هو اللون المميّز، والأساس كحلي (navy) ليتناسقا */
:root{--gold:#8f6200;--gold-bg:#fff3cf;--gold-ink:#2a1c00;--g1:#ffd84d;--g2:#f5b800;--g3:#e09f00}
:root[data-theme="dark"]{--gold:#f2c14e;--gold-bg:#33290f;--gold-ink:#fff6d6;--g1:#8a6400;--g2:#b58300;--g3:#d09a00}
body[data-sec="ledger"] #toastRoot{bottom:calc(env(safe-area-inset-bottom) + 96px)}

.profit{position:relative;border-radius:28px;padding:18px 18px 16px;color:var(--gold-ink);overflow:hidden;background:linear-gradient(145deg,var(--g1),var(--g2) 62%,var(--g3));box-shadow:0 16px 32px -16px rgba(224,159,0,.7);margin-top:-4px}
.profit::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.2);inset-inline-start:-70px;bottom:-105px;pointer-events:none}
.profit>*{position:relative;z-index:1}
.profit .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:15px}
.profit .big{font-size:44px;font-weight:700;line-height:1.15;margin:4px 0 2px;letter-spacing:-.5px}
.profit .big.neg{color:#8a1111}
:root[data-theme="dark"] .profit .big.neg{color:#ffb4b4}
.profit .sub{font-size:12.5px;opacity:.88;min-height:18px}
.pp{display:flex;gap:6px;margin-top:12px}
.pp button{flex:1;height:36px;border-radius:18px;font-size:14px;font-weight:700;background:rgba(255,255,255,.32);color:inherit;border:1px solid rgba(255,255,255,.4)}
.pp button[aria-pressed="true"]{background:var(--gold-ink);color:var(--g1);border-color:transparent}
:root[data-theme="dark"] .pp button[aria-pressed="true"]{color:#7d5b00}
.hk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hk>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 6px;text-align:center;box-shadow:var(--shadow2);min-width:0}
.hk small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.hk b{display:block;font-size:15.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk .d{background:linear-gradient(160deg,var(--card),var(--red-bg))}.hk .d b{color:var(--red)}
.hk .s{background:linear-gradient(160deg,var(--card),var(--gold-bg))}.hk .s b{color:var(--gold)}
.hk .v{background:linear-gradient(160deg,var(--card),var(--info-bg))}.hk .v b{color:var(--info)}
.acts2{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;margin-top:14px}
.bigbtn{height:62px;border-radius:20px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.bigbtn:active{transform:scale(.96)}
.bigbtn.gold{background:linear-gradient(145deg,#ffd84d,#f5b800);color:#2a1c00;box-shadow:0 14px 24px -12px #e09f00}
.bigbtn.teal{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 14px 24px -12px var(--teal)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow2);min-height:116px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ti2{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 10px 16px -10px var(--c1)}
.tile b{font-size:16.5px;line-height:1.2}
.tile small{color:var(--mute);font-size:12.5px;line-height:1.4}

.invrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow2);animation:rise .3s both}
.invrow:active{transform:scale(.99)}
.invrow .no{min-width:48px;height:48px;padding:0 6px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--gold-bg);color:var(--gold);direction:ltr}
.invrow .t{min-width:0}
.invrow .t b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invrow .t small{color:var(--mute);font-size:12.5px}
.invrow .a{font-weight:700;font-size:17px;text-align:end;color:var(--gold)}
.invrow.void{opacity:.6;background:var(--soft);border-style:dashed}.invrow.void .a{text-decoration:line-through}
.ptag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:700;margin-inline-start:6px;vertical-align:middle}
.ptag.debt{background:var(--red-bg);color:var(--red)}.ptag.cash{background:var(--green-bg);color:var(--green)}.ptag.void{background:var(--warn-bg);color:var(--warn)}
.ivmeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 10px}
.ivmeta>div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:12px;color:var(--mute);min-width:0}
.ivmeta b{display:block;color:var(--ink);font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
.ivmeta b.green{color:var(--green)}.ivmeta b.red{color:var(--red)}
.ivl{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:center}
.ivl small{display:block;color:var(--mute);font-size:12.5px}
.ivtot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:12px 14px;border-radius:16px;background:var(--gold-bg);color:var(--gold);font-weight:700;font-size:19px}
.buyer-pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:50px;padding:0 14px;border-radius:15px;border:1.5px solid var(--line);background:var(--soft);font-size:16px;text-align:start}
.buyer-pick.none{color:var(--mute)}
.buyer-pick .ic{color:var(--mute);transform:scaleX(-1)}
.kpi.gold{background:linear-gradient(145deg,var(--card),var(--gold-bg))}.kpi.gold b{color:var(--gold)}

/* تنبيه النسخ الاحتياطي (يظهر عند أول تشغيل) */
.bk-intro .m-card{border:3px solid #ff8a1f;box-shadow:0 0 0 7px rgba(255,138,31,.28),0 30px 60px -20px rgba(0,0,0,.65);background:linear-gradient(180deg,#fff1d6,var(--card) 42%)}
:root[data-theme="dark"] .bk-intro .m-card{background:linear-gradient(180deg,#4a2c07,var(--card) 45%)}
.bk-intro .m-head h3{font-size:21px;color:#c2410c}
:root[data-theme="dark"] .bk-intro .m-head h3{color:#ffb066}
.bk-ic{width:88px;height:88px;border-radius:30px;margin:2px auto 12px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#ff8a1f,#e11d48);box-shadow:0 16px 28px -10px #e11d48;animation:bkpulse 1.6s ease-in-out infinite}
.bk-ic .ic{width:44px;height:44px;stroke-width:2.2}
@keyframes bkpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.bk-intro h2{text-align:center;font-size:24px;line-height:1.4;margin:0 0 10px;color:#c2410c}
:root[data-theme="dark"] .bk-intro h2{color:#ffb066}
.bk-intro p{margin:0 0 10px;line-height:1.9;font-size:15.5px}
.bk-box{border-radius:16px;padding:10px 12px;margin-bottom:10px;font-size:14.5px;line-height:1.8;background:var(--green-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--green) 40%,transparent)}
.bk-box.warn{background:#ffe8c7;border-color:#ff8a1f}
:root[data-theme="dark"] .bk-box.warn{background:#4a2c07}
.bk-box b{display:block;margin-bottom:2px}
</style>

'use strict';

};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS=['كانون ثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين أول','تشرين ثاني','كانون أول'];
const PALETTE=[['#14213d','#2f5fb8'],['#c98a00','#f5b800'],['#6b45a8','#a77be0'],['#c2512c','#f08a60'],['#a23b5a','#e0708c'],['#2e7d4f','#5fbf8a'],['#0c7fa8','#46c4e6'],['#3a4bb8','#7b8cf0']];

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='')=>'<svg class="ic '+c+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const uid=()=>(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const round2=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt=n=>round2(Math.abs(n)).toLocaleString('en-US',{maximumFractionDigits:2});
const p2=n=>String(n).padStart(2,'0');
const dateStr=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};

const norm=s=>String(s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').trim().replace(/\s+/g,' ').toLowerCase();

function hueOf(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return PALETTE[Math.abs(h)%PALETTE.length]}

function parseNum(s){
  s=String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
   .replace(/[,٬،]/g,'').replace(/٫/g,'.').replace(/[^\d.]/g,'');
  const parts=s.split('.');if(parts.length>2)s=parts[0]+'.'+parts.slice(1).join('');
  const n=parseFloat(s);return isFinite(n)&&n<=1e9?round2(n):NaN;
}

const store={

};

let db={buyers:[]};
let settings=Object.assign({project:PROJECT_NAME,saveNotif:true,timeFormat:'12',oldDays:30,backupH:23,backupM:59},store.get(K.settings,{}));   // v14: backupH/backupM = ساعة النسخ التلقائي اليومي
const OLD_DAYS_OPTS=[15,30,45,60,90];

function normPrefs(o){o=o&&typeof o==='object'&&!Array.isArray(o)?o:{};const pk=Number(o.pack);return {beep:o.beep!==false,contCam:o.contCam!==false,pack:(pk>0&&pk<=100000)?pk:24}}   // v14: pack = عدد الحبات في الكرتونة (آخر قيمة استُعملت في «إضافة جملة»)
function savePrefs(){store.set(K.prefs,prefs)}
let notifs=store.get(K.notifs,[]);
const ui={tab:'home',ltab:'list',q:'',filter:'all',sort:'debt',detail:null,type:'debt',editId:null,hiddenAt:0,locked:false,quotaWarned:false,img:null,afterPad:null};

function timeStr(ts){
  const d=new Date(ts);
  const use12=settings.timeFormat!=='24';
  let h=d.getHours();let sfx='';
  if(use12){sfx=h>=12?' PM':' AM';h=h%12||12;}
  return p2(h)+':'+p2(d.getMinutes())+sfx;
}

/* ============ Global note suggestions ============ */
function getNotes(){return store.get(K.notes,{})||{}}
function bumpNote(text){
  text=String(text||'').trim().slice(0,80);if(!text)return;
  const notes=getNotes();const key=norm(text);
  if(notes[key]){notes[key].c=(notes[key].c||0)+1;notes[key].t=Date.now();notes[key].text=text;}
  else notes[key]={text,c:1,t:Date.now()};
  store.set(K.notes,notes);
}
function removeNote(text){const notes=getNotes();delete notes[norm(text)];store.set(K.notes,notes)}
function rankNotes(){
  const notes=getNotes();
  return Object.values(notes)
    .filter(n=>n&&n.text)
    .sort((a,b)=>(b.c||0)-(a.c||0)||(b.t||0)-(a.t||0));
}
function suggestNotes(q,limit){
  const all=rankNotes();
  q=norm(q);
  if(!q)return all.slice(0,limit||999);
  return all.filter(n=>norm(n.text).includes(q)).slice(0,limit||8);
}

function loadData(){

  if(d&&Array.isArray(d.buyers))db=normalizeDb(d);
}
/* v3: الهاتف — phoneIntl (+970599123456) لواتساب، phoneLocal (0599123456) للرسائل SMS
   v10: مقدمات الدول قابلة للتخصيص (قائمة + افتراضية) بدل +970/+972 الثابتتين */
const PFX_NAMES={'+970':'فلسطين','+972':'أراضي 48','+962':'الأردن','+20':'مصر','+966':'السعودية','+971':'الإمارات','+965':'الكويت','+974':'قطر','+973':'البحرين','+968':'عُمان','+961':'لبنان','+963':'سوريا','+964':'العراق','+967':'اليمن','+218':'ليبيا','+212':'المغرب','+213':'الجزائر','+216':'تونس','+249':'السودان','+90':'تركيا','+44':'بريطانيا','+49':'ألمانيا','+1':'أمريكا / كندا'};
const PFX_NO_TRUNK=['+1','+7'];   // دول لا تستعمل الصفر البادئ محلياً
const PFX_RE=/^\+\d{1,4}$/;
function normPfx(o){
  let list=['+970','+972'],def='+970';
  if(o&&typeof o==='object'&&Array.isArray(o.list)){
    const l=[...new Set(o.list.map(x=>String(x||'').replace(/\s+/g,'').replace(/^00/,'+')).filter(x=>PFX_RE.test(x)))].slice(0,12);
    if(l.length){list=l;def=PFX_RE.test(String(o.def))&&l.includes(o.def)?o.def:l[0]}
  }
  return {list,def};
}
let PFX=normPfx(store.get(K.pfx,null));
function savePfx(){store.set(K.pfx,PFX)}
function digitsOf(s){return String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'')}
const pfxDigits=p=>String(p||'').replace(/\D/g,'');
/* أطول مقدمة تبدأ بها الأرقام: من القائمة المخصّصة فقط (onlyList) أو أيضاً من قائمة الدول المعروفة */
function pfxOfIntl(intl,onlyList){
  const d=digitsOf(intl);let best='';
  (onlyList?PFX.list:PFX.list.concat(Object.keys(PFX_NAMES))).forEach(p=>{const pd=pfxDigits(p);if(pd&&d.startsWith(pd)&&pd.length>pfxDigits(best).length)best=p});
  return best;
}
const localOf=(prefix,n)=>PFX_NO_TRUNK.includes(prefix)?n:'0'+n;
function stripPfx(national,prefix){
  let n=digitsOf(national).replace(/^0+/,'');const pd=String(prefix||'').replace(/\D/g,'');
  if(pd&&n.startsWith(pd)&&n.length>=11)n=n.slice(pd.length).replace(/^0+/,'');
  return n.slice(0,15);
}
function phonePair(prefix,national){
  const n=stripPfx(national,prefix);
  return n?{phoneIntl:prefix+n,phoneLocal:localOf(prefix,n)}:{phoneIntl:'',phoneLocal:''};
}
function phoneFromLegacy(raw){
  raw=String(raw==null?'':raw);
  const plus=/^\s*\+/.test(raw),d=digitsOf(raw);
  if(!d)return {phoneIntl:'',phoneLocal:''};
  const fromIntl=x=>{   // x: رقم دولي بدون + (أو 00)
    const p=pfxOfIntl('+'+x);
    if(p){const rest=x.slice(pfxDigits(p).length).replace(/^0+/,'');return {phoneIntl:'+'+pfxDigits(p)+rest,phoneLocal:localOf(p,rest)}}
    return {phoneIntl:'+'+x,phoneLocal:'+'+x};
  };
  if(plus||d.startsWith('00'))return fromIntl(d.startsWith('00')?d.slice(2):d);
  const p0=pfxOfIntl('+'+d,true);   // بلا + : نعتبره دولياً فقط إن بدأ بمقدمة من قائمتك وكان طويلاً بما يكفي
  if(p0&&!d.startsWith('0')&&d.length>=pfxDigits(p0).length+7)return fromIntl(d);
  const n=d.replace(/^0+/,'');
  return {phoneIntl:PFX.def+n,phoneLocal:localOf(PFX.def,n)};
}
function normPhones(b){
  const I=String(b.phoneIntl||'').trim(),L=String(b.phoneLocal||'').trim();
  if(I||L){
    const intl=I?'+'+digitsOf(I):'',local=L?digitsOf(L):'';
    if(intl.length>1&&local)return {phoneIntl:intl.slice(0,20),phoneLocal:local.slice(0,20)};
    return phoneFromLegacy(intl.length>1?intl:local);
  }
  return phoneFromLegacy(b.phone);
}
/* الرقم المناسب للرسائل النصية: محلي لمقدمتك الافتراضية، ودولي لغيرها */
function smsNumber(b){
  const p=pfxOfIntl(b.phoneIntl);
  if(!p||p===PFX.def)return b.phoneLocal||b.phoneIntl||'';
  return b.phoneIntl||b.phoneLocal||'';
}
function normalizeDb(d){
  const out={buyers:[]};const seen=new Set();
  (d.buyers||[]).forEach(b=>{
    if(!b||typeof b.name!=='string'||!b.name.trim())return;
    let id=typeof b.id==='string'&&b.id&&!seen.has(b.id)?b.id:uid();seen.add(id);
    const txs=(Array.isArray(b.txs)?b.txs:[]).map(t=>{
      const amount=Number(t&&t.amount);
      if(!t||!(amount>0)||(t.type!=='debt'&&t.type!=='pay'))return null;
      return {id:typeof t.id==='string'&&t.id?t.id:uid(),type:t.type,amount:round2(amount),note:String(t.note||'').slice(0,200),
        date:Number(t.date)||Date.now(),void:!!t.void};
    }).filter(Boolean);
    const lim=Number(b.limit);
    out.buyers.push({id,name:b.name.trim().replace(/\s+/g,' ').slice(0,60),...normPhones(b),limit:lim>0?lim:0,created:Number(b.created)||Date.now(),txs});
  });
  return out;
}
function persist(){
  let ok=store.set(K.data,db);
  if(!ok){ // v5: البيانات الأساسية أهم من النسخ الداخلية؛ إن امتلأ التخزين نحذف أقدم النسخ الداخلية واحدة واحدة ونعيد المحاولة
    const snaps=store.get(K.backups,[]);
    while(!ok&&Array.isArray(snaps)&&snaps.length){snaps.shift();store.set(K.backups,snaps);ok=store.set(K.data,db)}
  }
  if(!ok&&!ui.quotaWarned){ui.quotaWarned=true;toast('تعذّر حفظ البيانات في المتصفح!','err')}
  if(ok)scheduleMirror(); // v7
  return ok;
}
/* v7: مرآة للنسخة الاحتياطية التلقائية والتطبيق مغلق. الخدمة الخلفية لا تقرأ localStorage، فنُرسل لها نسخة JSON وملف Excel جاهزين عند كل تغيير (وعند إخفاء التطبيق). */
var mirrorTimer=null;
function u8ToBase64(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)}
function syncMirror(){
  try{
    const B=window.Android;if(!B||typeof B.syncMirror!=='function')return;
    clearTimeout(mirrorTimer);
    const json=JSON.stringify(fullBackupObj(),null,2);
    const xl=db.buyers.length?u8ToBase64(buildExcelXlsx()):'';
    B.syncMirror(json,xl,'كشف - '+excelProjName()+' - ',xl?excelSignature():'');   // v8: + بصمة الجدول كي لا تحفظ الخدمة الخلفية ملفاً مطابقاً لآخر ملف محفوظ
  }catch(e){console.warn('mirror failed',e)}
}
function scheduleMirror(){clearTimeout(mirrorTimer);mirrorTimer=setTimeout(syncMirror,1500)}
function exportObj(){return {app:'ledger',v:1,exported:Date.now(),project:settings.project,buyers:db.buyers}}

/* ============ v2 backup: نسخة احتياطية كاملة (تصدير/استرجاع) ============ */
// v2 backup — exportObj() أعلاه لم يُعدَّل (تستعمله النسخ الداخلية اليومية). النسخة الكاملة لها بانٍ مستقل.
const BK_MAX_CHARS=20*1024*1024;
let bkWaitPick=false,bkInput=null;
function fullBackupObj(){ // v2 backup
  return {app:'hesabak',v:2,exported:Date.now(),project:settings.project,
    settings:{project:settings.project,saveNotif:!!settings.saveNotif,timeFormat:settings.timeFormat==='24'?'24':'12',oldDays:oldDays()},
    theme:themePref(),
    notes:getNotes(),notifs:notifs,buyers:db.buyers,
    inventory:inv,invoices:invc,   // v9/v12: المخزون والفواتير ضمن النسخة الكاملة
    prefixes:PFX,prefs:prefs};   // v10: مقدمات الأرقام + تفضيلات الباركود
}
function exportFullBackup(){ // v2 backup
  const json=JSON.stringify(fullBackupObj(),null,2);
  const blob=new Blob([json],{type:'application/json'});
  downloadBlob(blob,'hesabak-backup-'+dateStr(Date.now())+'.json');
  store.set(K.fullBk,dateStr(Date.now())); // v5: يعتمد عليه شريط التنبيه (في التطبيق تُحجز الكتابة حتى تأكيد حفظ الملف)
  store.set(K.exported,Date.now());
  renderBanner();
  toast('✅ تم تصدير النسخة الكاملة','ok');
}
function bkValidate(o){ // v2 backup — يرمي استثناءً إن لم تكن النسخة صالحة (يقبل v1 وv2)
  if(!o||typeof o!=='object'||Array.isArray(o)||!Array.isArray(o.buyers))throw new Error('shape');
  if(o.app!==undefined&&o.app!=='hesabak'&&o.app!=='ledger')throw new Error('app');
  if(o.v!==undefined&&o.v!==1&&o.v!==2)throw new Error('ver');
  const n=normalizeDb(o);
  if(o.buyers.length&&!n.buyers.length)throw new Error('empty');
  return n;
}
function bkParse(text){ // v2 backup
  let obj,nd;
  try{
    if(typeof text!=='string'||!text||text.length>BK_MAX_CHARS)throw new Error('size');
    obj=JSON.parse(text.replace(/^\uFEFF/,''));
    nd=bkValidate(obj);
  }catch(e){toast('❌ الملف غير صالح','err');return}
  const nt=nd.buyers.reduce((s,b)=>s+b.txs.length,0);
  confirmBox({title:'استرجاع نسخة كاملة',danger:true,ok:'استرجاع',
    msg:'سيتم حذف كل البيانات الحالية واستبدالها ببيانات هذه النسخة. هل أنت متأكد؟<br><small style="color:var(--mute)">(النسخة تحتوي '+nd.buyers.length+' مشتري و '+nt+' حركة)</small>',
    onOk:()=>{importObj(obj)}});
}
function importFullBackup(){ // v2 backup
  if(window.Android&&typeof window.Android.pickFile==='function'){
    bkWaitPick=true;
    try{window.Android.pickFile('application/json')}catch(e){bkWaitPick=false;toast('❌ الملف غير صالح','err')}
    return;
  }
  if(!bkInput){
    bkInput=document.createElement('input');bkInput.type='file';bkInput.accept='.json,application/json';bkInput.hidden=true;
    bkInput.addEventListener('change',()=>{
      const f=bkInput.files&&bkInput.files[0];bkInput.value='';
      if(!f)return;
      if(f.size>BK_MAX_CHARS){toast('❌ الملف غير صالح','err');return}
      const r=new FileReader();
      r.onload=()=>bkParse(String(r.result||''));
      r.onerror=()=>toast('❌ الملف غير صالح','err');
      r.readAsText(f,'utf-8');
    });
    document.body.appendChild(bkInput);
  }
  bkInput.click();
}
window.onFilePicked=function(text){ // v2 backup — يستدعيها الجسر الأندرويدي
  if(!bkWaitPick)return;bkWaitPick=false;
  bkParse(text==null?'':String(text));
};
window.onFilePickCancel=function(){bkWaitPick=false}; // v2 backup
function importObj(obj){ // v2 backup — استبدال كامل، كل شيء أو لا شيء
  let nd;
  try{nd=bkValidate(obj)}catch(e){toast('❌ الملف غير صالح','err');return false}
  // الحقول الاختيارية: تُنقّى بقائمة بيضاء، والمفقود أو غير الصالح يُتجاهل
  const writes=[[K.data,nd]];
  let ns=null,nTheme=null,nNotes=null,nNotifs=null;
  const so=(obj.settings&&typeof obj.settings==='object'&&!Array.isArray(obj.settings))?obj.settings:{};
  const proj=typeof so.project==='string'&&so.project.trim()?so.project:(typeof obj.project==='string'?obj.project:'');
  const slotOk=Number.isInteger(so.backupH)&&so.backupH>=0&&so.backupH<24&&Number.isInteger(so.backupM)&&so.backupM>=0&&so.backupM<60;   // v14
  if(proj.trim()||typeof so.saveNotif==='boolean'||so.timeFormat==='12'||so.timeFormat==='24'||OLD_DAYS_OPTS.includes(Number(so.oldDays))||slotOk){
    ns=Object.assign({},settings);
    if(proj.trim())ns.project=proj.trim().slice(0,40);
    if(typeof so.saveNotif==='boolean')ns.saveNotif=so.saveNotif;
    if(so.timeFormat==='12'||so.timeFormat==='24')ns.timeFormat=so.timeFormat;
    if(OLD_DAYS_OPTS.includes(Number(so.oldDays)))ns.oldDays=Number(so.oldDays);
    if(slotOk){ns.backupH=so.backupH;ns.backupM=so.backupM}
    writes.push([K.settings,ns]);
  }
  if(obj.theme==='dark'||obj.theme==='light'||obj.theme==='auto'){nTheme=obj.theme;writes.push([K.theme,nTheme])}
  if(obj.notes&&typeof obj.notes==='object'&&!Array.isArray(obj.notes)){
    nNotes=Object.create(null);
    Object.values(obj.notes).slice(0,2000).forEach(v=>{
      if(!v||typeof v.text!=='string')return;
      const text=v.text.trim().slice(0,80);if(!text)return;
      const c=Number(v.c);
      nNotes[norm(text)]={text,c:c>0?Math.min(Math.floor(c),1e6):1,t:Number(v.t)||Date.now()};
    });
    writes.push([K.notes,nNotes]);
  }
  if(Array.isArray(obj.notifs)){
    nNotifs=obj.notifs.slice(0,200).filter(n=>n&&typeof n==='object').map(n=>({
      id:typeof n.id==='string'&&n.id?n.id.slice(0,60):uid(),
      type:['alert','save','file'].includes(n.type)?n.type:'info',
      title:String(n.title==null?'':n.title).slice(0,120),
      text:String(n.text==null?'':n.text).slice(0,300),
      ts:Number(n.ts)||Date.now(),read:!!n.read}));
    writes.push([K.notifs,nNotifs]);
  }
  let nInv=null,nIvc=null;   // v9 + v12 (الفواتير)
  if(obj.inventory&&typeof obj.inventory==='object'&&!Array.isArray(obj.inventory)){nInv=normInv(obj.inventory);writes.push([KS.inv,nInv])}
  if(obj.invoices&&typeof obj.invoices==='object'&&!Array.isArray(obj.invoices))nIvc=pruneInvoices(normInvoices(obj.invoices),nd);
  else{   // نسخة قديمة (قبل الفواتير): تُحوَّل مبيعاتها النقدية في الخزنة إلى فواتير
    nIvc=normInvoices(null);
    if(nInv&&Array.isArray(obj.safe))safeToInvoices(normSafeLegacy(obj.safe),nInv,nIvc);
  }
  writes.push([KS.invc,nIvc]);
  let nPfx=null,nPrefs=null;   // v10
  if(obj.prefixes&&typeof obj.prefixes==='object'&&Array.isArray(obj.prefixes.list)){nPfx=normPfx(obj.prefixes);writes.push([K.pfx,nPfx])}
  if(obj.prefs&&typeof obj.prefs==='object'&&!Array.isArray(obj.prefs)){nPrefs=normPrefs(obj.prefs);writes.push([K.prefs,nPrefs])}
  const keys=[K.data,K.settings,K.theme,K.notes,K.notifs,KS.inv,KS.invc,K.pfx,K.prefs],old={};
  try{keys.forEach(k=>{old[k]=localStorage.getItem(k)})}catch(e){toast('❌ تعذّر استرجاع النسخة','err');return false}
  try{makeSnapshot()}catch(e){} // نقطة تراجع: تبقى حالة ما قبل الاسترجاع في نسخة اليوم الداخلية
  let ok=true;
  for(const [k,v] of writes){if(!store.set(k,v)){ok=false;break}}
  if(!ok){
    try{keys.forEach(k=>{if(old[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,old[k])})}catch(e){}
    toast('❌ تعذّر حفظ النسخة، لم يتغيّر شيء','err');return false;
  }
  db=nd;if(ns)settings=ns;if(nNotifs)notifs=nNotifs;if(nInv)inv=nInv;if(nIvc)invc=nIvc;
  if(nPfx)PFX=nPfx;if(nPrefs)prefs=nPrefs;
  applyTheme();renderProject();renderBadge();renderBar();renderHome();refreshSec();
  if(ui.detail){if(buyerById(ui.detail))afterChange();else closeDetail()}
  while(modals.length)modals[modals.length-1].close();
  toast('✅ تم استرجاع النسخة بنجاح','ok');
  return true;
}

/* ============ v10: تتبّع الديون بدقة ============
   تُوزَّع التسديدات على الديون من الأقدم إلى الأحدث (FIFO) فنعرف لكل دين: كم سُدِّد منه وكم تبقّى وعمره.
   لا تاريخ استحقاق (أُلغي في v3): «العمر» = الأيام منذ تسجيل الدين، للعرض والتنبيه فقط. */
function debtInfo(b,now){
  now=now||Date.now();
  const live=b.txs.filter(t=>!t.void).sort((x,y)=>x.date-y.date||(x.type===y.type?0:x.type==='debt'?-1:1));
  let pool=0,debtTotal=0,payTotal=0,lastPay=0;
  live.forEach(t=>{if(t.type==='pay'){pool+=t.amount;payTotal+=t.amount;lastPay=Math.max(lastPay,t.date)}else debtTotal+=t.amount});
  pool=round2(pool);
  const per={},open=[];
  live.forEach(t=>{
    if(t.type!=='debt')return;
    const a=Math.min(t.amount,pool);pool=round2(pool-a);
    const rem=round2(t.amount-a);per[t.id]={paid:round2(a),rem};
    if(rem>0.004)open.push({t,rem,days:Math.max(0,Math.floor((now-t.date)/864e5))});
  });
  const oldest=open.length?open[0]:null;
  return {bal:balanceOf(b),debtTotal:round2(debtTotal),payTotal:round2(payTotal),lastPay,per,open,oldest,ageDays:oldest?oldest.days:0,credit:pool};
}
function daysTxt(n){n=Math.max(0,Math.floor(n));return n===0?'اليوم':n===1?'أمس':n===2?'قبل يومين':n<=10?'قبل '+n+' أيام':'قبل '+n+' يوماً'}
function ageCls(days){const d=oldDays();return days>=d*2?'r':days>=d?'w':''}
function nameTaken(name,exceptId){const n=norm(name);return db.buyers.some(b=>b.id!==exceptId&&norm(b.name)===n)}

/* ============ Toast (dismissible) ============ */
let toastTimer=null;
function toast(msg,type='info',undo){
  const root=$('#toastRoot');root.innerHTML='';clearTimeout(toastTimer);
  const el=document.createElement('div');el.className='toast '+type;el.setAttribute('role',type==='err'?'alert':'status');
  const icon=type==='ok'?'check':type==='err'?'alert':'clock';
  el.innerHTML='<span class="ti">'+ic(icon,'sm')+'</span><span class="m">'+esc(msg)+'</span>'+(undo?'<button type="button" data-toast="undo">تراجع</button>':'');
  root.appendChild(el);
  const close=()=>{el.classList.add('out');setTimeout(()=>el.remove(),250)};
  el.addEventListener('click',e=>{
    if(e.target.closest('[data-toast]'))return;
    clearTimeout(toastTimer);close();
  });
  if(undo)el.querySelector('[data-toast]').addEventListener('click',ev=>{ev.stopPropagation();clearTimeout(toastTimer);el.remove();undo()});
  toastTimer=setTimeout(close,undo?6000:3500);
}

const modals=[];
function openModal(o){
  const el=document.createElement('div');el.className='modal'+(o.sheet?' sheet':'');
  const tid='mt'+uid().slice(0,6);
  el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-labelledby',tid);
  const acts=o.actions||[];
  el.innerHTML='<div class="m-card"><div class="m-head"><h3 id="'+tid+'">'+esc(o.title)+'</h3><button type="button" class="icon-btn" data-m="x" aria-label="إغلاق">'+ic('close')+'</button></div>'+
    '<div class="m-body">'+o.body+'</div>'+
    (acts.length?'<div class="m-foot">'+acts.map((a,i)=>'<button type="button" class="btn '+(a.cls||'ghost')+'" data-m="a'+i+'">'+esc(a.label)+'</button>').join('')+'</div>':'')+'</div>';
  const api={el,closed:false,dismiss(){remove(true)},close(){remove(false)}};
  function remove(cancel){
    if(api.closed)return;api.closed=true;
    const i=modals.indexOf(api);if(i>=0)modals.splice(i,1);
    el.remove();
    try{if(cancel&&o.onCancel)o.onCancel()}finally{if(o.onClose)o.onClose()}
  }
  el.addEventListener('click',e=>{
    if(e.target===el){api.dismiss();return}
    const b=e.target.closest('[data-m]');if(!b)return;
    const k=b.getAttribute('data-m');
    if(k==='x'){api.dismiss();return}
    const a=acts[+k.slice(1)];if(!a)return;
    if(a.cancel){api.dismiss();return}
    const r=a.fn?a.fn(api):undefined;
    if(r!==false)api.close();
  });
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.tagName==='INPUT'){
      const p=el.querySelector('.m-foot .btn.primary,.m-foot .btn.danger');if(p){e.preventDefault();p.click()}
    }
  });
  $('#modalRoot').appendChild(el);modals.push(api);
  const f=el.querySelector('input:not([type=checkbox]),textarea');if(f&&o.focus!==false)setTimeout(()=>{try{f.focus()}catch(e){}},60);
  return api;
}

/* v6: ملف xlsx حقيقي (ZIP + XML بلا مكتبات خارجية) يفتح على Excel وNumbers وGoogle Sheets وLibreOffice (لابتوب وأندرويد وiOS).
   كان سابقاً HTML بامتداد xls، وهو ما يسبب تحذيراً في Excel ولا يفتحه بعض تطبيقات الجوال. لا تُصدَّر الحركات التفصيلية (ملخص فقط). */
const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zipStore(files){ // ZIP بلا ضغط (method 0)، أسماء UTF-8
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const nm=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,data);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+data.length;
  });
  let cdSize=0;cd.forEach(x=>cdSize+=x.length);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  const all=parts.concat(cd,[end]);let total=0;all.forEach(x=>total+=x.length);
  const out=new Uint8Array(total);let o=0;all.forEach(x=>{out.set(x,o);o+=x.length});return out;
}

/* v8: نموذج بيانات الجدول (مشترك بين بناء الملف وبصمة المقارنة كي لا يختلفا أبداً) */
function excelModel(){
  const totals=db.buyers.map(b=>({b,bal:balanceOf(b),n:b.txs.filter(t=>!t.void).length}));
  const grandTotal=round2(totals.reduce((s,r)=>s+(r.bal>0?r.bal:0),0));
  const debtors=totals.filter(r=>r.bal>0.004).length;
  const totalTx=totals.reduce((n,r)=>n+r.n,0);
  totals.sort((a,c)=>c.bal-a.bal);
  return {totals,grandTotal,debtors,totalTx};
}
/* v8: بصمة محتوى الجدول (بدون تاريخ/وقت التصدير) — cyrb53 */
function excelSignature(){
  const m=excelModel();
  const str=JSON.stringify([settings.project,m.grandTotal,db.buyers.length,m.debtors,m.totalTx,
    m.totals.map(x=>[x.b.name,x.b.phoneLocal||'',x.n,round2(x.bal)])]);
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}

  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)+'-'+str.length;
}

/* v6: اسم الملف: كشف - اسم المشروع - تاريخ اليوم */
function excelProjName(){ // v7
  return String(settings.project||'').replace(/[\\/:*?"<>|\u0000-\u001F]/g,' ').replace(/\s+/g,' ').trim().slice(0,40)||'حسابك';
}
function excelFileName(){
  return 'كشف - '+excelProjName()+' - '+dateStr(Date.now())+'.xlsx';
}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;a.style.display='none';
  document.body.appendChild(a);
  try{a.click();}catch(e){}
  setTimeout(()=>{try{a.remove();URL.revokeObjectURL(url)}catch(e){}},120000); // v7: كان 4 ثوانٍ، فيُلغى الرابط قبل بدء التنزيل في المتصفح (نافذة إذن/تنزيلات متعددة) فيظهر فشل ثم ينجح عند المحاولة الثانية
}

/* v7: تأكيد قبل أي تنزيل يدوي (Excel أو JSON). التصدير التلقائي لا يمر من هنا. */
function confirmDownload(kind,fn){

}

function exportExcel(auto){
  if(db.buyers.length === 0){
    if(!auto) toast('لا يوجد مشترون لتصديرهم','info');

  }
  /* v8: إن كان محتوى الجدول مطابقاً لآخر جدول حُفظ فعلاً فلا يُحفظ ملف جديد (تلقائي ويدوي) */
  const sig = excelSignature();
  if(sig === lastSavedSig()){
    if(auto){
      /* نعتبر اليوم «مفحوصاً» كي لا يُعاد الفحص عند كل فتح؛ لا ملف ولا إشعار */
      store.set(K.excelLast, dateStr(Date.now()));
      renderBar();renderBanner();
    }else{
      toast('ℹ️ لا تغييرات منذ آخر ملف محفوظ، لم يُحفظ ملف جديد','info');
    }

  }
  const blob = new Blob([buildExcelXlsx()],{type:XLSX_MIME});

  store.set(K.excelLast, dateStr(Date.now()));
  store.set(K.exported, Date.now());

    mobileNotify('📊 تم حفظ نسخة Excel','حُفظت نسخة اليوم: '+dateStr(Date.now()));
  }else{
    haptic(18);
    toast('✅ تم تصدير: '+fname,'ok');
    if(settings.saveNotif) notifySave(Date.now(),'الملف: '+fname);
  }

async function shareExcel(){
  if(db.buyers.length === 0){ toast('لا يوجد مشترون','info'); return; }
  const blob = new Blob([buildExcelXlsx()],{type:XLSX_MIME});
  const fname = excelFileName();
  const file = new File([blob], fname, {type:XLSX_MIME});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      await navigator.share({files:[file], title:'سجل المعاملات', text:'سجل '+settings.project+' — '+dateStr(Date.now())});
      store.set(K.excelLast, dateStr(Date.now()));
      store.set(K.exported, Date.now());
      renderBar();renderBanner();
      return;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  confirmDownload('excel',()=>exportExcel(false)); // v7: بديل المشاركة هو تنزيل
}

/* v13: داخل التطبيق، النسخة اليومية (Excel + JSON) مسؤولية الجانب الأصلي وحده (AlarmManager عند 23:59 + WorkManager احتياطاً).
   الصفحة لم تعد تُصدّر بنفسها (كانت تتسابق مع الخدمة الخلفية عند تغيّر اليوم فتتكرر الملفات أو تتأخر)؛ تكتفي بتحديث «آخر نسخة» وبطلب فحص فوري. */
function nativeOwnsBackup(){const B=window.Android;return !!(B&&typeof B.syncMirror!=='undefined'&&typeof B.runBackupNow!=='undefined')}
function adoptNativeBackup(){
  try{
    const B=window.Android;if(!B||typeof B.lastAutoBackupDay==='undefined')return;
    const d=String(B.lastAutoBackupDay()||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;
    let changed=false;
    [K.fullBk,K.excelLast].forEach(k=>{const cur=store.get(k,'');if(!cur||String(cur)<d){store.set(k,d);changed=true}});
    if(changed){renderBar();renderBanner()}
  }catch(e){}
}
function exactAlarmNeeded(){const B=window.Android;try{return !!(B&&typeof B.canExactAlarm!=='undefined'&&!B.canExactAlarm())}catch(e){return false}}
function checkDailyExport(){
  if(nativeOwnsBackup()){
    syncSlotNative();   // v14: يضمن تطابق وقت النسخ بين الصفحة والجانب الأصلي (بعد استرجاع نسخة مثلاً)
    adoptNativeBackup();
    try{window.Android.runBackupNow()}catch(e){}
    return;
  }
  if(db.buyers.length === 0) return;
  const firstRun = store.get(K.first,0);
  if(!firstRun) return;
  const today = dateStr(Date.now());
  const firstDay = dateStr(firstRun);
  // لا تصدّر في اليوم الأول مطلقاً
  if(today === firstDay) return;
  const lastExcel = store.get(K.excelLast,'');
  if(lastExcel === today) return;
  try{ exportExcel(true); }catch(e){ console.warn('auto export failed', e); }
}

/* v14: وقت النسخ التلقائي صار يختاره المستخدم (الافتراضي 23:59). نفس القيمة تُرسل للجانب الأصلي (Android.setBackupSlot) */
function slotHM(){
  const h=Number(settings.backupH),m=Number(settings.backupM);
  return {h:(Number.isInteger(h)&&h>=0&&h<24)?h:23,m:(Number.isInteger(m)&&m>=0&&m<60)?m:59};
}
function slotLabel(){const s=slotHM();return timeStr(new Date(2000,0,1,s.h,s.m,0,0).getTime())}
function syncSlotNative(){try{const B=window.Android;if(B&&typeof B.setBackupSlot!=='undefined'){const s=slotHM();B.setBackupSlot(s.h,s.m)}}catch(e){}}
function lastSlot(now){const s=slotHM(),d=new Date(now);d.setHours(s.h,s.m,0,0);if(d.getTime()>now)d.setDate(d.getDate()-1);return d.getTime()}
function nextSlot(now){const s=slotHM(),d=new Date(lastSlot(now));return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,s.h,s.m,0,0).getTime()}

/* v5: النسخ اليومية الداخلية — 3 نسخ كحد أقصى + سقف بالحجم حتى لا تزاحم البيانات الأساسية في localStorage (سعته نحو 5.2 مليون حرف) */
const SNAP_MAX_COUNT=3;
const SNAP_SAFE_TOTAL=3500000; // أقصى مجموع (بالحروف) لكل ما في localStorage بما فيه النسخ؛ الباقي هامش لنمو البيانات
function lsUsage(skipKey){
  let n=0;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k===skipKey)continue;const v=localStorage.getItem(k);n+=k.length+(v?v.length:0)}}catch(e){}
  return n;
}
function makeSnapshot(){
  try{
    const now=Date.now(),day=dateStr(now);
    let snaps=store.get(K.backups,[]);if(!Array.isArray(snaps))snaps=[];
    const snap={ts:now,day,data:exportObj()};
    const i=snaps.findIndex(s=>s.day===day);
    if(i>=0)snaps[i]=snap;else snaps.push(snap);
    snaps.sort((a,b)=>a.ts-b.ts);
    while(snaps.length>SNAP_MAX_COUNT)snaps.shift();
    // اترك الأحدث ما دام مجموع الحجم يتسع ضمن السقف (قد لا يتسع إلا للأحدث أو لا شيء إن كانت البيانات كبيرة)
    let room=SNAP_SAFE_TOTAL-lsUsage(K.backups);
    const keep=[];
    for(let j=snaps.length-1;j>=0;j--){
      const sz=JSON.stringify(snaps[j]).length+1;
      if(sz>room)break;
      room-=sz;keep.unshift(snaps[j]);
    }
    // إن رفض التخزين الكتابة رغم ذلك: احذف الأقدم وأعد المحاولة. لا نلمس البيانات الأساسية هنا أبداً.
    while(!store.set(K.backups,keep)&&keep.length)keep.shift();
  }catch(e){console.warn('snapshot failed',e)}
}

function doSave(kind){
  persist();
  const now = Date.now();
  makeSnapshot();
  store.set(K.last, now);
  renderBar();
  if(kind === 'manual'){ confirmDownload('excel',()=>exportExcel(false)); } // v7
}

function checkAuto(){

  if(!last){store.set(K.last,now)}
  else if(last < lastSlot(now)){
    persist();makeSnapshot();store.set(K.last, now);renderBar();
  }
  checkDailyExport();
}

function renderBar(){
